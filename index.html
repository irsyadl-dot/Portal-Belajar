        function initPedomanEvents() {
            const modalOverlay = document.getElementById('pedoman-modal-overlay');
            const modalInput = document.getElementById('pedoman-modal-input');
            const modalConfirm = document.getElementById('pedoman-modal-confirm');
            const modalCancel = document.getElementById('pedoman-modal-cancel');

            document.getElementById('pedoman-btn-new-folder').addEventListener('click', () => {
                openPedomanModal('Buat Folder Baru', 'Masukkan nama folder untuk pedoman hidup Anda.', 'Buat', (
                    name) => {
                    if (name.trim()) {
                        const id = generatePedomanId();
                        pedomanFolders.push({ id, name: name.trim(), gradient: getPedomanGradient(),
                            icon: getPedomanIcon() });
                        pedomanContents[id] = [
                            { id: generatePedomanId(), type: 'surah', image: null, caption: '' },
                            { id: generatePedomanId(), type: 'asbab', content: '' },
                            { id: generatePedomanId(), type: 'makna', content: '' }
                        ];
                        savePedomanData();
                        renderPedomanFolders();
                        showPedomanToast(`Folder "${name.trim()}" berhasil dibuat`, 'fa-folder-plus', '#6C3CE1');
                    }
                });
            });

            document.getElementById('pedoman-btn-back-home').addEventListener('click', goPedomanHome);

            const searchInput = document.getElementById('pedoman-search-input');
            const searchClear = document.getElementById('pedoman-search-clear');
            searchInput.addEventListener('input', () => {
                pedomanSearchQuery = searchInput.value;
                searchClear.classList.toggle('visible', !!pedomanSearchQuery);
                renderPedomanFolders();
            });
            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                pedomanSearchQuery = '';
                searchClear.classList.remove('visible');
                renderPedomanFolders();
                searchInput.focus();
            });

            document.querySelectorAll('#pedoman-detail-tabs .detail-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.dataset.tab;
                    if (tabId) activatePedomanTab(tabId);
                });
            });

            document.getElementById('pedoman-surah-file-input').addEventListener('change', function() {
                if (!currentPedomanFolderId) return;
                const files = Array.from(this.files);
                if (files.length) {
                    addPedomanSurahImages(currentPedomanFolderId, files);
                }
                this.value = '';
            });

            document.getElementById('pedoman-btn-delete-folder').addEventListener('click', () => {
                if (currentPedomanFolderId) confirmDeletePedomanFolder(currentPedomanFolderId);
            });

            modalCancel.addEventListener('click', closePedomanModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closePedomanModal();
            });
            modalConfirm.addEventListener('click', () => {
                if (typeof pedomanModalCallback === 'function') pedomanModalCallback(modalInput.value);
            });
            modalInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (typeof pedomanModalCallback === 'function') pedomanModalCallback(e.target.value);
                }
                if (e.key === 'Escape') closePedomanModal();
            });

            document.querySelectorAll('.pedoman-app .editor-toolbar').forEach(toolbar => {
                const editorId = toolbar.dataset.editor;
                const editor = document.getElementById('pedoman-' + editorId + '-editor');
                if (!editor) return;

                toolbar.querySelectorAll('.toolbar-btn[data-cmd]').forEach(btn => {
                    btn.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        const cmd = btn.dataset.cmd;
                        if (cmd === 'link') {
                            const url = prompt('Masukkan URL:', 'https://');
                            if (url) document.execCommand('createLink', false, url);
                        } else if (cmd === 'unlink') {
                            document.execCommand('unlink', false, null);
                        } else if (cmd === 'removeFormat') {
                            document.execCommand('removeFormat', false, null);
                        } else {
                            document.execCommand(cmd, false, null);
                        }
                        editor.focus();
                        updatePedomanToolbarState(toolbar, editor);
                    });
                });

                toolbar.querySelectorAll('.pedoman-editor-image-input').forEach(input => {
                    input.addEventListener('change', function() {
                        if (this.files && this.files.length) {
                            const file = this.files[0];
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                insertPedomanImageWithWrapper(editor, e.target.result);
                            };
                            reader.readAsDataURL(file);
                        }
                        this.value = '';
                    });
                });

                let editorTimeout = null;
                editor.addEventListener('input', () => {
                    clearTimeout(editorTimeout);
                    updatePedomanGlobalSaveIndicator(false);
                    editorTimeout = setTimeout(() => {
                        savePedomanEditorContent(editorId);
                    }, 600);
                });

                editor.addEventListener('blur', () => {
                    savePedomanEditorContent(editorId);
                });

                editor.addEventListener('mouseup', () => updatePedomanToolbarState(toolbar, editor));
                editor.addEventListener('keyup', () => updatePedomanToolbarState(toolbar, editor));

                const saveBtn = toolbar.closest('.rich-editor-wrapper').querySelector(
                    '.pedoman-btn-save-editor');
                if (saveBtn) {
                    saveBtn.addEventListener('click', () => {
                        savePedomanEditorContent(editorId);
                        showPedomanToast('Catatan tersimpan', 'fa-save', '#34d399');
                    });
                }

                updatePedomanToolbarState(toolbar, editor);
                bindPedomanEditorImageInteractions(editor);
            });
        }

        function renderPedomanFolders() {
            const grid = document.getElementById('pedoman-folder-grid');
            const count = document.getElementById('pedoman-folder-count');
            if (!grid) return;

            const query = pedomanSearchQuery.toLowerCase().trim();
            let filtered = pedomanFolders;
            if (query) {
                filtered = pedomanFolders.filter(f => f.name.toLowerCase().includes(query));
            }

            if (filtered.length === 0) {
                const msg = pedomanFolders.length === 0 ?
                    'Belum ada folder. Buat folder baru untuk mulai mencatat pedoman hidup.' :
                    'Tidak ada folder yang cocok dengan pencarian.';
                grid.innerHTML = `<div class="empty-state"><i class="fas fa-folder-open"></i><p>${msg}</p></div>`;
                count.textContent = '';
                return;
            }

            count.textContent = `${filtered.length} folder${filtered.length > 1 ? '' : ''}`;

            let html = '';
            for (const f of filtered) {
                const items = pedomanContents[f.id] || [];
                const hasContent = items.some(i => {
                    if (i.type === 'surah') return i.image || (i.caption && i.caption.trim());
                    if (i.type === 'asbab' || i.type === 'makna') return i.content && i.content.trim();
                    return false;
                });
                const noteCount = hasContent ? 1 : 0;

                html += `
                        <div class="folder-card" data-id="${f.id}" style="background: ${f.gradient || getPedomanGradient()};">
                            <button class="delete-folder-btn" data-id="${f.id}" title="Hapus folder"><i class="fas fa-times"></i></button>
                            <div class="folder-icon"><i class="fas ${f.icon || getPedomanIcon()}"></i></div>
                            <div class="folder-name">${escapeHtml(f.name)}</div>
                            <div class="folder-meta"><i class="fas fa-book" style="margin-right:4px;"></i> ${noteCount > 0 ? `${noteCount} catatan` : 'Kosong'}</div>
                        </div>
                    `;
            }
            grid.innerHTML = html;

            grid.querySelectorAll('.folder-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-folder-btn')) return;
                    const id = card.dataset.id;
                    if (id) openPedomanDetail(id);
                });
            });

            grid.querySelectorAll('.delete-folder-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    if (id) confirmDeletePedomanFolder(id);
                });
            });
        }

        function openPedomanDetail(folderId) {
            if (!folderId || !pedomanFolders.find(f => f.id === folderId)) {
                showPedomanToast('Folder tidak ditemukan', 'fa-exclamation-circle', '#f59e0b');
                return;
            }
            currentPedomanFolderId = folderId;
            document.getElementById('pedoman-page-main').classList.remove('active');
            document.getElementById('pedoman-page-detail').classList.add('active');
            renderPedomanDetail(folderId);
        }

        function goPedomanHome() {
            currentPedomanFolderId = null;
            document.getElementById('pedoman-page-detail').classList.remove('active');
            document.getElementById('pedoman-page-main').classList.add('active');
            renderPedomanFolders();
        }

        function renderPedomanDetail(folderId) {
            const f = pedomanFolders.find(f => f.id === folderId);
            if (!f) return;
            document.getElementById('pedoman-detail-title').textContent = f.name;

            renderPedomanSurahGallery(folderId);

            const items = pedomanContents[folderId] || [];
            const asbabItem = items.find(i => i.type === 'asbab');
            const maknaItem = items.find(i => i.type === 'makna');
            const asbabEditor = document.getElementById('pedoman-asbab-editor');
            const maknaEditor = document.getElementById('pedoman-makna-editor');
            asbabEditor.innerHTML = asbabItem ? asbabItem.content || '' : '';
            maknaEditor.innerHTML = maknaItem ? maknaItem.content || '' : '';

            updatePedomanGlobalSaveIndicator(true);
            activatePedomanTab(pedomanActiveTab);
            setTimeout(() => {
                bindPedomanEditorImageInteractions(asbabEditor);
                bindPedomanEditorImageInteractions(maknaEditor);
            }, 100);
        }

        function renderPedomanSurahGallery(folderId) {
            const items = pedomanContents[folderId] || [];
            const surahItems = items.filter(i => i.type === 'surah');
            const container = document.getElementById('pedoman-surah-gallery');
            if (!container) return;

            if (surahItems.length === 0) {
                container.innerHTML =
                    `<div class="surah-empty"><i class="fas fa-image"></i><p>Belum ada gambar. Upload gambar untuk mulai mencatat.</p></div>`;
                return;
            }

            let html = '';
            for (let i = 0; i < surahItems.length; i++) {
                const item = surahItems[i];
                const imgHtml = item.image ?
                    `<div class="surah-img-wrap"><img src="${escapeHtml(item.image)}" alt="Gambar surah" loading="lazy" /><div class="resize-hint"><i class="fas fa-expand"></i> seret sudut</div></div>` :
                    `<div style="background:rgba(255,255,255,0.04);border-radius:12px;padding:24px;text-align:center;color:rgba(255,255,255,0.2);margin-bottom:12px;"><i class="fas fa-image" style="font-size:2rem;"></i><p style="font-size:0.8rem;margin-top:4px;">Tidak ada gambar</p></div>`;
                html += `
                        <div class="surah-item" data-index="${i}">
                            <button class="delete-surah-btn" data-index="${i}" title="Hapus"><i class="fas fa-times"></i></button>
                            ${imgHtml}
                            <textarea class="caption-area" data-index="${i}" placeholder="Tulis catatan untuk gambar ini…" spellcheck="false">${escapeHtml(item.caption || '')}</textarea>
                        </div>
                    `;
            }
            container.innerHTML = html;

            container.querySelectorAll('.caption-area').forEach(textarea => {
                autoExpandPedoman(textarea);
                textarea.addEventListener('input', () => {
                    autoExpandPedoman(textarea);
                    const idx = parseInt(textarea.dataset.index, 10);
                    debounceSavePedomanCaption(folderId, idx, textarea.value);
                });
                textarea.addEventListener('focus', () => autoExpandPedoman(textarea));
            });

            container.querySelectorAll('.delete-surah-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index, 10);
                    deletePedomanSurahItem(folderId, idx);
                });
            });

            container.querySelectorAll('.surah-img-wrap').forEach(wrap => {
                if (!wrap.style.width) {
                    wrap.style.width = '100%';
                    wrap.style.maxWidth = '100%';
                }
            });
        }

        let pedomanCaptionTimeout = null;

        function debounceSavePedomanCaption(folderId, index, value) {
            clearTimeout(pedomanCaptionTimeout);
            pedomanCaptionTimeout = setTimeout(() => {
                const items = pedomanContents[folderId] || [];
                const surahItems = items.filter(i => i.type === 'surah');
                if (index >= surahItems.length) return;
                surahItems[index].caption = value;
                savePedomanData();
                updatePedomanGlobalSaveIndicator(true);
            }, 500);
            updatePedomanGlobalSaveIndicator(false);
        }

        function deletePedomanSurahItem(folderId, index) {
            const items = pedomanContents[folderId] || [];
            const surahItems = items.filter(i => i.type === 'surah');
            if (index >= surahItems.length) return;
            const itemId = surahItems[index].id;
            const idxInAll = items.findIndex(i => i.id === itemId);
            if (idxInAll !== -1) {
                items.splice(idxInAll, 1);
                savePedomanData();
                renderPedomanSurahGallery(folderId);
                showPedomanToast('Item surah dihapus', 'fa-trash-alt', '#f59e0b');
            }
        }

        function addPedomanSurahImages(folderId, files) {
            const items = pedomanContents[folderId] || [];
            let loaded = 0;
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    items.push({ id: generatePedomanId(), type: 'surah', image: e.target.result, caption: '' });
                    loaded++;
                    if (loaded === files.length) {
                        savePedomanData();
                        renderPedomanSurahGallery(folderId);
                        showPedomanToast(`${files.length} gambar berhasil ditambahkan`, 'fa-image', '#6C3CE1');
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function autoExpandPedoman(textarea) {
            if (!textarea) return;
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function activatePedomanTab(tabId) {
            pedomanActiveTab = tabId;
            document.querySelectorAll('#pedoman-detail-tabs .detail-tab').forEach(t => t.classList.remove('active'));
            const tabBtn = document.querySelector(`#pedoman-detail-tabs .detail-tab[data-tab="${tabId}"]`);
            if (tabBtn) tabBtn.classList.add('active');

            document.querySelectorAll('#pedoman-page-detail .detail-panel').forEach(p => p.classList.remove('active'));
            const panel = document.getElementById('pedoman-' + tabId);
            if (panel) panel.classList.add('active');

            if (tabId === 'tab-asbab' || tabId === 'tab-makna') {
                setTimeout(() => {
                    if (currentPedomanFolderId) {
                        const items = pedomanContents[currentPedomanFolderId] || [];
                        const editorId = tabId === 'tab-asbab' ? 'pedoman-asbab-editor' :
                            'pedoman-makna-editor';
                        const editor = document.getElementById(editorId);
                        const type = tabId === 'tab-asbab' ? 'asbab' : 'makna';
                        const item = items.find(i => i.type === type);
                        if (editor && item && editor.innerHTML !== (item.content || '')) {
                            editor.innerHTML = item.content || '';
                            bindPedomanEditorImageInteractions(editor);
                        } else if (editor) {
                            bindPedomanEditorImageInteractions(editor);
                        }
                    }
                }, 80);
            }
        }

        function updatePedomanToolbarState(toolbar, editor) {
            toolbar.querySelectorAll('.toolbar-btn[data-cmd]').forEach(btn => {
                const cmd = btn.dataset.cmd;
                if (['bold', 'italic', 'underline'].includes(cmd)) {
                    if (document.queryCommandState(cmd)) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            });
        }

        function savePedomanEditorContent(editorName) {
            if (!currentPedomanFolderId) return;
            const items = pedomanContents[currentPedomanFolderId] || [];
            const type = editorName === 'asbab' ? 'asbab' : 'makna';
            const editor = document.getElementById('pedoman-' + editorName + '-editor');
            if (!editor) return;
            editor.querySelectorAll('.img-wrap').forEach(w => { if (!w.querySelector('img')) w.remove(); });
            const content = editor.innerHTML.trim();
            let item = items.find(i => i.type === type);
            if (!item) {
                item = { id: generatePedomanId(), type, content: '' };
                items.push(item);
            }
            item.content = content;
            savePedomanData();
            updatePedomanGlobalSaveIndicator(true);
        }

        function updatePedomanGlobalSaveIndicator(saved) {
            const el = document.getElementById('pedoman-global-save-indicator');
            if (!el) return;
            if (saved) {
                el.className = 'save-indicator saved';
                el.innerHTML = '<i class="fas fa-check-circle"></i> Semua perubahan tersimpan';
            } else {
                el.className = 'save-indicator saving';
                el.innerHTML = '<i class="fas fa-spinner"></i> Menyimpan…';
            }
        }

        function bindPedomanEditorImageInteractions(editor) {
            if (!editor) return;
            editor.querySelectorAll('.img-wrap').forEach(wrap => {
                if (!wrap.hasAttribute('contenteditable')) wrap.contentEditable = false;
                if (wrap.dataset.bound) return;
                wrap.dataset.bound = 'true';
                makePedomanImageDraggable(wrap);
                makePedomanImageResizable(wrap);
            });
        }

        let pedomanDragData = null;

        function makePedomanImageDraggable(wrap) {
            wrap.draggable = true;
            wrap.addEventListener('dragstart', handlePedomanDragStart);
            wrap.addEventListener('dragend', handlePedomanDragEnd);
            wrap.addEventListener('dragover', handlePedomanDragOver);
            wrap.addEventListener('drop', handlePedomanDrop);
        }

        function handlePedomanDragStart(e) {
            const wrap = e.target.closest('.img-wrap');
            if (!wrap) return;
            pedomanDragData = { element: wrap, html: wrap.outerHTML, editor: wrap.closest('.editor-content') };
            wrap.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', wrap.outerHTML);
            e.dataTransfer.setData('text/plain', 'img-wrap-drag');
        }

        function handlePedomanDragEnd(e) {
            const wrap = e.target.closest('.img-wrap');
            if (wrap) wrap.classList.remove('dragging');
            document.querySelectorAll('.pedoman-app .img-wrap.drag-over').forEach(el => el.classList.remove('drag-over'));
            document.querySelectorAll('.pedoman-app .editor-content.drag-over').forEach(el => el.classList.remove(
                'drag-over'));
            pedomanDragData = null;
        }

        function handlePedomanDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.editor-content');
            if (target) target.classList.add('drag-over');
        }

        function handlePedomanDrop(e) {
            e.preventDefault();
            const editor = e.target.closest('.editor-content');
            if (!editor) return;
            editor.classList.remove('drag-over');

            const dragType = e.dataTransfer.getData('text/plain');
            if (dragType !== 'img-wrap-drag' || !pedomanDragData) return;

            const dragWrap = pedomanDragData.element;
            if (!dragWrap || !dragWrap.parentNode) return;

            const range = getPedomanRangeFromDropEvent(e, editor);
            if (!range) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                const newRange = document.createRange();
                newRange.setStart(editor, editor.childNodes.length);
                newRange.collapse(false);
                sel.addRange(newRange);
                const clone = dragWrap.cloneNode(true);
                clone.classList.remove('dragging');
                clone.contentEditable = false;
                clone.dataset.bound = 'true';
                makePedomanImageDraggable(clone);
                makePedomanImageResizable(clone);
                editor.insertBefore(clone, null);
                dragWrap.remove();
                const editorName = editor.id.replace('pedoman-', '').replace('-editor', '');
                savePedomanEditorContent(editorName);
                showPedomanToast('Gambar dipindahkan', 'fa-arrows-alt', '#6C3CE1');
                return;
            }

            const clone = dragWrap.cloneNode(true);
            clone.classList.remove('dragging');
            clone.contentEditable = false;
            clone.dataset.bound = 'true';
            makePedomanImageDraggable(clone);
            makePedomanImageResizable(clone);
            dragWrap.remove();

            range.insertNode(clone);
            range.setStartAfter(clone);
            range.collapse(true);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);

            const editorName = editor.id.replace('pedoman-', '').replace('-editor', '');
            savePedomanEditorContent(editorName);
            showPedomanToast('Gambar dipindahkan', 'fa-arrows-alt', '#6C3CE1');
            pedomanDragData = null;
        }

        function getPedomanRangeFromDropEvent(e, editor) {
            const range = document.caretRangeFromPoint(e.clientX, e.clientY);
            if (range && editor.contains(range.commonAncestorContainer)) return range;
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                const r = sel.getRangeAt(0);
                if (editor.contains(r.commonAncestorContainer)) return r;
            }
            return null;
        }

        function makePedomanImageResizable(wrap) {
            let handle = wrap.querySelector('.resize-handle');
            if (!handle) {
                handle = document.createElement('div');
                handle.className = 'resize-handle';
                handle.innerHTML = '<i class="fas fa-arrows-alt-h"></i>';
                wrap.appendChild(handle);
            }
            if (wrap._resizeListener) {
                handle.removeEventListener('mousedown', wrap._resizeListener);
            }
            const listener = function(e) {
                e.preventDefault();
                e.stopPropagation();
                const rect = wrap.getBoundingClientRect();
                const startX = e.clientX;
                const startY = e.clientY;
                const startW = rect.width;
                const startH = rect.height;

                function onMove(ev) {
                    ev.preventDefault();
                    const dx = ev.clientX - startX;
                    const dy = ev.clientY - startY;
                    let newW = Math.max(80, startW + dx);
                    let newH = Math.max(60, startH + dy);
                    const editorRect = wrap.closest('.editor-content').getBoundingClientRect();
                    const maxW = editorRect.width * 0.9;
                    if (newW > maxW) newW = maxW;
                    wrap.style.width = newW + 'px';
                    wrap.style.height = 'auto';
                    clearTimeout(wrap._resizeTimeout);
                    wrap._resizeTimeout = setTimeout(() => {
                        const editorName = wrap.closest('.editor-content').id.replace('pedoman-', '')
                            .replace('-editor', '');
                        savePedomanEditorContent(editorName);
                    }, 300);
                }

                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    const editorName = wrap.closest('.editor-content').id.replace('pedoman-', '').replace(
                        '-editor', '');
                    savePedomanEditorContent(editorName);
                }
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            };
            handle.addEventListener('mousedown', listener);
            wrap._resizeListener = listener;
        }

        function insertPedomanImageWithWrapper(editor, dataUrl) {
            editor.focus();

            let sel = window.getSelection();
            let range;
            if (sel.rangeCount > 0) {
                range = sel.getRangeAt(0);
                if (!editor.contains(range.commonAncestorContainer)) {
                    range = document.createRange();
                    range.setStart(editor, editor.childNodes.length);
                    range.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(range);
                }
            } else {
                range = document.createRange();
                range.setStart(editor, editor.childNodes.length);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            }

            const wrap = document.createElement('div');
            wrap.className = 'img-wrap';
            wrap.draggable = true;
            wrap.contentEditable = false;
            wrap.style.width = '240px';
            wrap.style.height = 'auto';
            wrap.style.minWidth = '60px';
            wrap.style.minHeight = '60px';

            const img = document.createElement('img');
            img.src = dataUrl;
            img.alt = 'Gambar';
            img.style.width = '100%';
            img.style.height = 'auto';
            img.style.display = 'block';
            img.style.borderRadius = '6px';
            img.style.pointerEvents = 'none';
            wrap.appendChild(img);

            const handle = document.createElement('div');
            handle.className = 'resize-handle';
            handle.innerHTML = '<i class="fas fa-arrows-alt-h"></i>';
            wrap.appendChild(handle);

            makePedomanImageDraggable(wrap);
            makePedomanImageResizable(wrap);

            range.insertNode(wrap);
            range.setStartAfter(wrap);
            const spaceNode = document.createTextNode('\u00A0');
            range.insertNode(spaceNode);
            range.setStartAfter(spaceNode);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);

            const editorName = editor.id.replace('pedoman-', '').replace('-editor', '');
            savePedomanEditorContent(editorName);
            showPedomanToast('Gambar ditambahkan — seret untuk pindah, sudut kanan bawah untuk resize', 'fa-image',
                '#6C3CE1');
        }

        let pedomanModalCallback = null;

        function openPedomanModal(title, desc, confirmText, callback) {
            document.getElementById('pedoman-modal-title').textContent = title;
            document.getElementById('pedoman-modal-desc').textContent = desc || '';
            document.getElementById('pedoman-modal-input').value = '';
            document.getElementById('pedoman-modal-confirm').textContent = confirmText || 'Konfirmasi';
            pedomanModalCallback = callback;
            document.getElementById('pedoman-modal-overlay').classList.add('open');
            setTimeout(() => document.getElementById('pedoman-modal-input').focus(), 100);
        }

        function closePedomanModal() {
            document.getElementById('pedoman-modal-overlay').classList.remove('open');
            pedomanModalCallback = null;
        }

        function confirmDeletePedomanFolder(id) {
            const f = pedomanFolders.find(f => f.id === id);
            if (!f) return;
            openPedomanModal('Hapus Folder?', `Apakah Anda yakin ingin menghapus folder "${f.name}"? Semua data di dalamnya akan hilang.`,
                'Hapus', () => {
                    pedomanFolders = pedomanFolders.filter(f => f.id !== id);
                    delete pedomanContents[id];
                    savePedomanData();
                    showPedomanToast(`Folder "${f.name}" telah dihapus`, 'fa-trash', '#FF6B6B');
                    if (currentPedomanFolderId === id) goPedomanHome();
                    else renderPedomanFolders();
                    closePedomanModal();
                });
        }

        function createPedomanStars() {
            const bg = document.getElementById('galaxy-bg');
            if (!bg) return;
            const count = 180;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.8 + 0.6;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.opacity = 0.3 + Math.random() * 0.7;
                bg.appendChild(star);
            }
        }

        function initPedomanNebula() {
            const canvas = document.getElementById('nebula-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            const PARTICLE_COUNT = 55;

            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                w = canvas.width = rect.width;
                h = canvas.height = rect.height;
            }
            resize();
            window.addEventListener('resize', resize);

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = Math.random() * 120 + 40;
                    this.speedX = (Math.random() - 0.5) * 0.15;
                    this.speedY = (Math.random() - 0.5) * 0.10;
                    this.opacity = 0.03 + Math.random() * 0.06;
                    this.pulse = Math.random() * Math.PI * 2;
                    this.pulseSpeed = 0.003 + Math.random() * 0.006;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.pulse += this.pulseSpeed;
                    if (this.x < -this.size) this.x = w + this.size;
                    if (this.x > w + this.size) this.x = -this.size;
                    if (this.y < -this.size) this.y = h + this.size;
                    if (this.y > h + this.size) this.y = -this.size;
                }
                draw(ctx) {
                    const alpha = this.opacity * (0.7 + 0.3 * Math.sin(this.pulse));
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                    grad.addColorStop(0, `rgba(180, 140, 255, ${alpha})`);
                    grad.addColorStop(0.4, `rgba(120, 80, 220, ${alpha * 0.6})`);
                    grad.addColorStop(1, `rgba(80, 40, 180, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, w, h);
                for (const p of particles) { p.update();
                    p.draw(ctx); }
                requestAnimationFrame(animate);
            }
            animate();

            const ro = new ResizeObserver(() => resize());
            ro.observe(canvas.parentElement);
        }

        // ============================================
        // BACKUP & RESTORE SEMUA DATA
        // ============================================
        function backupData() {
            const data = {
                materi_folders: localStorage.getItem('materi_folders'),
                materi_contents: localStorage.getItem('materi_contents'),
                eng_alphabet: localStorage.getItem('eng_alphabet'),
                eng_daily: localStorage.getItem('eng_daily'),
                eng_vocab: localStorage.getItem('eng_vocab'),
                pedoman_folders: localStorage.getItem('pedoman_folders'),
                pedoman_contents: localStorage.getItem('pedoman_contents'),
                timestamp: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `portal_belajar_backup_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            URL.revokeObjectURL(link.href);
            alert('✅ Data berhasil di-backup!');
        }

        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    let count = 0;
                    if (data.materi_folders) { localStorage.setItem('materi_folders', data.materi_folders); count++; }
                    if (data.materi_contents) { localStorage.setItem('materi_contents', data.materi_contents); count++; }
                    if (data.eng_alphabet) { localStorage.setItem('eng_alphabet', data.eng_alphabet); count++; }
                    if (data.eng_daily) { localStorage.setItem('eng_daily', data.eng_daily); count++; }
                    if (data.eng_vocab) { localStorage.setItem('eng_vocab', data.eng_vocab); count++; }
                    if (data.pedoman_folders) { localStorage.setItem('pedoman_folders', data.pedoman_folders); count++; }
                    if (data.pedoman_contents) { localStorage.setItem('pedoman_contents', data.pedoman_contents); count++; }
                    alert(`✅ Restore berhasil! ${count} data dimuat. Halaman akan refresh.`);
                    location.reload();
                } catch(err) {
                    alert('❌ File tidak valid! Pastikan file backup dari web ini.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================
        // KEYBOARD SHORTCUTS (global)
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePreview();
                closeModal();
                closeEngModal();
                closePedomanModal();
            }
        });

        // ============================================
        // AUTO-RESTORE APLIKASI TERAKHIR SAAT REFRESH
        // ============================================
        window.addEventListener('load', function() {
            const lastApp = localStorage.getItem('lastApp');
            if (lastApp && ['materi', 'english', 'pedoman'].includes(lastApp)) {
                setTimeout(() => {
                    openApp(lastApp);
                }, 300);
            }
        });

        console.log('Portal Belajar siap — semua data tersimpan di localStorage!');
    </script>
