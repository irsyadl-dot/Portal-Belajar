<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Belajar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== GLOBAL RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #eef6fe, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.4s;
        }
        body.english-mode {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(255, 200, 150, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(200, 180, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(255, 220, 180, 0.1) 0%, transparent 40%);
        }
        body.english-mode.light-mode {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(255, 200, 150, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(200, 180, 255, 0.15) 0%, transparent 50%);
        }
        body.pedoman-mode {
            background: transparent;
        }
        body.pedoman-mode::before {
            display: none;
        }

        .main-wrapper {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .main-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 40, 80, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.7);
            text-align: center;
            transition: all 0.4s;
        }
        body.english-mode .main-container {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.08);
        }
        body.english-mode.light-mode .main-container {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.05);
        }
        body.pedoman-mode .main-container {
            background: transparent !important;
            backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            border-radius: 0 !important;
        }

        .main-title {
            font-weight: 700;
            font-size: 2.8rem;
            background: linear-gradient(135deg, #0b3a5e, #1b5e8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        body.english-mode .main-title {
            background: linear-gradient(135deg, #e74c3c, #f39c12, #2ecc71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.pedoman-mode .main-title {
            background: linear-gradient(135deg, #c4b5fd, #8B5CF6, #6C3CE1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(108, 60, 225, 0.2);
        }
        .main-subtitle {
            color: #6b93b3;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }
        body.english-mode .main-subtitle {
            color: #5a4a3a;
        }
        body.pedoman-mode .main-subtitle {
            color: rgba(196, 181, 253, 0.4);
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }
        .menu-card {
            background: white;
            border-radius: 28px;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(200, 222, 245, 0.5);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        body.english-mode .menu-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }
        body.english-mode.light-mode .menu-card {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
        }
        body.pedoman-mode .menu-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(108, 60, 225, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        body.pedoman-mode .menu-card:hover {
            border-color: rgba(108, 60, 225, 0.3);
            box-shadow: 0 18px 35px -14px rgba(108, 60, 225, 0.1);
        }
        .menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 35px -14px #1a5f8b30;
        }
        .menu-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 0.8rem;
        }
        .menu-icon.materi {
            color: #2b7bb0;
            background: rgba(43, 123, 176, 0.1);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 0.8rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-icon.materi i {
            font-size: 2.5rem;
        }
        body.english-mode .menu-icon.materi {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }
        body.pedoman-mode .menu-icon.materi {
            background: rgba(108, 60, 225, 0.08);
            color: #8B5CF6;
        }
        .menu-icon.english {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 0.8rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-icon.english i {
            font-size: 2.5rem;
        }
        body.english-mode .menu-icon.english {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
        }
        body.pedoman-mode .menu-icon.english {
            background: rgba(108, 60, 225, 0.08);
            color: #8B5CF6;
        }
        .menu-icon.pedoman {
            color: #8B5CF6;
            background: rgba(108, 60, 225, 0.12);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 0.8rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-icon.pedoman i {
            font-size: 2.8rem;
        }
        body.pedoman-mode .menu-icon.pedoman {
            background: rgba(108, 60, 225, 0.15);
            color: #c4b5fd;
            box-shadow: 0 0 30px rgba(108, 60, 225, 0.1);
        }
        .menu-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: #0b2b4a;
            margin-bottom: 0.3rem;
        }
        body.english-mode .menu-name {
            color: #2c3e50;
        }
        body.english-mode.light-mode .menu-name {
            color: #2c3e50;
        }
        body.pedoman-mode .menu-name {
            color: #c4b5fd;
        }
        .menu-desc {
            color: #6b93b3;
            font-size: 0.85rem;
        }
        body.english-mode .menu-desc {
            color: #5a4a3a;
        }
        body.english-mode.light-mode .menu-desc {
            color: #5a4a3a;
        }
        body.pedoman-mode .menu-desc {
            color: rgba(196, 181, 253, 0.4);
        }
        #appContainer {
            display: none;
            width: 100%;
            margin: 0 auto;
        }
        #appContainer.show {
            display: block;
        }

        .btn-back-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(26, 95, 139, 0.1);
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #1a5f8b;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        body.english-mode .btn-back-home {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }
        body.english-mode.light-mode .btn-back-home {
            background: rgba(231, 76, 60, 0.06);
            color: #c0392b;
        }
        body.pedoman-mode .btn-back-home {
            background: rgba(108, 60, 225, 0.2);
            color: #c4b5fd;
            backdrop-filter: blur(4px);
        }
        body.pedoman-mode .btn-back-home:hover {
            background: rgba(108, 60, 225, 0.4);
        }
        .btn-back-home:hover {
            background: rgba(26, 95, 139, 0.2);
        }
        body.english-mode .btn-back-home:hover {
            background: rgba(231, 76, 60, 0.2);
        }

        /* Tombol Backup & Restore di menu utama */
        .backup-restore-bar {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin-top: 2.5rem;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(26, 95, 139, 0.08);
        }
        .backup-restore-bar button {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Inter', sans-serif;
        }
        .backup-restore-bar .btn-backup {
            background: #1a5f8b;
            color: white;
            box-shadow: 0 8px 16px -6px #1a5f8b60;
        }
        .backup-restore-bar .btn-backup:hover {
            background: #0f4a70;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -8px #1a5f8b80;
        }
        .backup-restore-bar .btn-restore {
            background: #b87333;
            color: white;
            box-shadow: 0 8px 16px -6px #b8733360;
        }
        .backup-restore-bar .btn-restore:hover {
            background: #9a6229;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -8px #b8733380;
        }
        .backup-restore-bar input[type="file"] {
            display: none;
        }

        @media (max-width:768px) {
            .main-container {
                padding: 1.8rem 1.5rem;
            }
            .main-title {
                font-size: 2rem;
            }
            .menu-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .backup-restore-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .backup-restore-bar button {
                justify-content: center;
            }
        }

        /* ===== MATERI APP STYLES ===== */
        .materi-app-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 40, 80, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.7);
            min-height: 70vh;
            text-align: left;
        }
        body.english-mode .materi-app-wrapper {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.08);
        }
        body.english-mode.light-mode .materi-app-wrapper {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.05);
        }
        body.pedoman-mode .materi-app-wrapper {
            background: rgba(10, 10, 30, 0.7);
            border: 1px solid rgba(108, 60, 225, 0.1);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4), 0 0 60px rgba(108, 60, 225, 0.02);
            border-radius: 48px;
        }
        .materi-app-wrapper .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .materi-app-wrapper .header h1 {
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0b3a5e, #1b5e8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        body.english-mode .materi-app-wrapper .header h1 {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.pedoman-mode .materi-app-wrapper .header h1 {
            background: linear-gradient(135deg, #c4b5fd, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .materi-app-wrapper .header h1 i {
            background: #1a5f8b;
            padding: 0.5rem;
            border-radius: 30px;
            color: white;
            font-size: 1.4rem;
            -webkit-text-fill-color: white;
            box-shadow: 0 8px 14px -6px rgba(10, 55, 94, 0.3);
        }
        body.english-mode .materi-app-wrapper .header h1 i {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
        }
        body.pedoman-mode .materi-app-wrapper .header h1 i {
            background: linear-gradient(135deg, #8B5CF6, #6C3CE1);
            -webkit-text-fill-color: #fff;
        }
        .materi-app-wrapper .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .materi-app-wrapper .btn-back {
            background: rgba(26, 95, 139, 0.1);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #1a5f8b;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 0.4rem;
            transition: 0.2s;
        }
        body.english-mode .materi-app-wrapper .btn-back {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }
        body.pedoman-mode .materi-app-wrapper .btn-back {
            background: rgba(108, 60, 225, 0.1);
            color: #8B5CF6;
        }
        .materi-app-wrapper .btn-back:hover {
            background: rgba(26, 95, 139, 0.2);
        }
        .materi-app-wrapper .btn-back.show {
            display: flex;
        }
        .materi-app-wrapper .search-box {
            background: white;
            padding: 0.4rem 1.2rem 0.4rem 1.8rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: 0 6px 16px rgba(27, 80, 128, 0.06);
            border: 1px solid rgba(60, 130, 200, 0.12);
        }
        body.english-mode .materi-app-wrapper .search-box {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
        }
        body.english-mode.light-mode .materi-app-wrapper .search-box {
            background: white;
            border-color: rgba(255, 255, 255, 0.3);
        }
        body.pedoman-mode .materi-app-wrapper .search-box {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(108, 60, 225, 0.1);
        }
        .materi-app-wrapper .search-box i {
            color: #2b7bb0;
        }
        body.english-mode .materi-app-wrapper .search-box i {
            color: #e74c3c;
        }
        body.pedoman-mode .materi-app-wrapper .search-box i {
            color: #8B5CF6;
        }
        .materi-app-wrapper .search-box input {
            border: none;
            padding: 0.6rem 0;
            width: 180px;
            font-size: 0.9rem;
            background: transparent;
            outline: none;
            color: #0b2b4a;
        }
        body.english-mode .materi-app-wrapper .search-box input {
            color: #2c3e50;
        }
        body.english-mode.light-mode .materi-app-wrapper .search-box input {
            color: #0b2b4a;
        }
        body.pedoman-mode .materi-app-wrapper .search-box input {
            color: #c4b5fd;
        }
        .materi-app-wrapper .search-box input::placeholder {
            color: #9bb7d4;
        }
        body.english-mode .materi-app-wrapper .search-box input::placeholder {
            color: #999;
        }
        body.pedoman-mode .materi-app-wrapper .search-box input::placeholder {
            color: rgba(196, 181, 253, 0.3);
        }
        .materi-app-wrapper .btn {
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .materi-app-wrapper .btn-primary {
            background: #1a5f8b;
            color: white;
            box-shadow: 0 8px 14px -6px #1a5f8b60;
        }
        body.english-mode .materi-app-wrapper .btn-primary {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            box-shadow: 0 8px 32px rgba(231, 76, 60, 0.2);
        }
        body.pedoman-mode .materi-app-wrapper .btn-primary {
            background: linear-gradient(135deg, #8B5CF6, #6C3CE1);
            color: #fff;
            box-shadow: 0 8px 32px rgba(108, 60, 225, 0.2);
        }
        .materi-app-wrapper .btn-primary:hover {
            background: #0f4a70;
            transform: translateY(-2px);
        }
        .materi-app-wrapper .btn-outline {
            background: transparent;
            border: 1px solid #b3d3ed;
            color: #0e3d5e;
        }
        body.english-mode .materi-app-wrapper .btn-outline {
            border-color: rgba(255, 255, 255, 0.3);
            color: #2c3e50;
        }
        body.english-mode.light-mode .materi-app-wrapper .btn-outline {
            border-color: rgba(255, 255, 255, 0.3);
            color: #0e3d5e;
        }
        body.pedoman-mode .materi-app-wrapper .btn-outline {
            border-color: rgba(108, 60, 225, 0.15);
            color: #8B5CF6;
        }
        .materi-app-wrapper .btn-outline:hover {
            background: rgba(26, 95, 139, 0.06);
        }
        .materi-app-wrapper .btn-sm {
            padding: 0.35rem 1rem;
            font-size: 0.78rem;
        }
        .materi-app-wrapper .btn-danger {
            background: #b54a4a;
            color: white;
        }
        .materi-app-wrapper .btn-danger:hover {
            background: #9e3a3a;
        }
        .materi-app-wrapper .btn-success {
            background: #2a7a5e;
            color: white;
        }
        .materi-app-wrapper .btn-success:hover {
            background: #1e5f48;
        }
        .materi-app-wrapper .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 0.5rem;
        }
        .materi-app-wrapper .folder-card {
            background: white;
            border-radius: 28px;
            padding: 1.5rem 1.2rem;
            box-shadow: 0 8px 20px -8px rgba(10, 55, 94, 0.06);
            border: 1px solid rgba(200, 222, 245, 0.5);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.25s;
            text-align: center;
        }
        body.english-mode .materi-app-wrapper .folder-card {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
        }
        body.english-mode.light-mode .materi-app-wrapper .folder-card {
            background: white;
            border-color: rgba(255, 255, 255, 0.3);
        }
        body.pedoman-mode .materi-app-wrapper .folder-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(108, 60, 225, 0.08);
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.2);
        }
        .materi-app-wrapper .folder-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 35px -14px #1a5f8b30;
        }
        body.pedoman-mode .materi-app-wrapper .folder-card:hover {
            border-color: rgba(108, 60, 225, 0.2);
            box-shadow: 0 18px 35px -14px rgba(108, 60, 225, 0.1);
        }
        .materi-app-wrapper .folder-card .icon {
            font-size: 2.8rem;
            color: #2b7bb0;
            margin-bottom: 0.3rem;
        }
        body.english-mode .materi-app-wrapper .folder-card .icon {
            color: #e74c3c;
        }
        body.pedoman-mode .materi-app-wrapper .folder-card .icon {
            color: #8B5CF6;
        }
        .materi-app-wrapper .folder-card .name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0b2b4a;
        }
        body.english-mode .materi-app-wrapper .folder-card .name {
            color: #2c3e50;
        }
        body.english-mode.light-mode .materi-app-wrapper .folder-card .name {
            color: #0b2b4a;
        }
        body.pedoman-mode .materi-app-wrapper .folder-card .name {
            color: #c4b5fd;
        }
        .materi-app-wrapper .folder-card .tag-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }
        .materi-app-wrapper .folder-card .tag {

<body>

    <div class="main-wrapper">

    <script>
        // ============================================
        // NAVIGASI UTAMA
        // ============================================
        function openApp(app) {
            localStorage.setItem('lastApp', app);
            document.getElementById('mainMenu').style.display = 'none';
            const container = document.getElementById('appContainer');
            container.classList.add('show');
            container.style.display = 'block';

            document.body.className = '';
            if (app === 'english') {
                document.body.classList.add('english-mode');
                if (localStorage.getItem('theme') === 'light') {
                    document.body.classList.add('light-mode');
                }
            } else if (app === 'pedoman') {
                document.body.classList.add('pedoman-mode');
            }

            const content = document.getElementById('appContent');
            if (app === 'materi') loadMateri(content);
            else if (app === 'english') loadEnglish(content);
            else if (app === 'pedoman') loadPedoman(content);
        }

        function goHome() {
            localStorage.removeItem('lastApp');
            document.getElementById('mainMenu').style.display = 'block';
            const container = document.getElementById('appContainer');
            container.classList.remove('show');
            container.style.display = 'none';
            document.body.className = '';
            document.getElementById('appContent').innerHTML = '';
            closeModal();
            closePreview();
            closeEngModal();
        }

        // ============================================
        // MATERI APP — DENGAN IndexedDB UNTUK FILE
        // ============================================
        let folders = [];
        let contents = {};
        let currentFolderId = null;

        // ---- IndexedDB helpers ----
        function openMateriDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('PortalBelajarMateriDB', 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('files')) {
                        db.createObjectStore('files', { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function saveFileToMateriDB(id, dataUrl) {
            return new Promise((resolve, reject) => {
                openMateriDB().then(db => {
                    const tx = db.transaction('files', 'readwrite');
                    const store = tx.objectStore('files');
                    const req = store.put({ id, dataUrl });
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                }).catch(reject);
            });
        }

        function getFileFromMateriDB(id) {
            return new Promise((resolve, reject) => {
                openMateriDB().then(db => {
                    const tx = db.transaction('files', 'readonly');
                    const store = tx.objectStore('files');
                    const req = store.get(id);
                    req.onsuccess = () => resolve(req.result ? req.result.dataUrl : null);
                    req.onerror = () => reject(req.error);
                }).catch(reject);
            });
        }

        function deleteFileFromMateriDB(id) {
            return new Promise((resolve, reject) => {
                openMateriDB().then(db => {
                    const tx = db.transaction('files', 'readwrite');
                    const store = tx.objectStore('files');
                    const req = store.delete(id);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                }).catch(reject);
            });
        }

        // ---- localStorage untuk metadata ----
        function saveMateriData() {
            try {
                localStorage.setItem('materi_folders', JSON.stringify(folders));
                localStorage.setItem('materi_contents', JSON.stringify(contents));
                return true;
            } catch (e) {
                alert('⚠️ Gagal menyimpan metadata: ' + e.message);
                return false;
            }
        }

        function loadMateriData() {
            const f = localStorage.getItem('materi_folders');
            const c = localStorage.getItem('materi_contents');
            if (f && c) {
                try {
                    folders = JSON.parse(f);
                    contents = JSON.parse(c);
                    return true;
                } catch (_) { return false; }
            }
            return false;
        }

        function initMateriData() {
            if (!loadMateriData()) {
                folders = [
                    { id: 'f1', name: 'Algoritma & Struktur Data', tags: ['UTS', '2026'], favorite: false },

            for (const key in contents) {

        function renderHomeMateri() {
            const grid = document.getElementById('folderGridMateri');

            let filtered = folders.filter(f =>

                grid.innerHTML =

            let html = '';

                    <div class="folder-card" onclick="openDetailMateri('${f.id}')">

            document.getElementById('detailTitleMateri').innerHTML = `<i class="fas fa-folder-open"></i> ${folder.name}`;
            document.getElementById('detailTagsMateri').innerHTML = (folder.tags || []).map(t =>
                `<span class="tag">#${t}</span>`).join('');
            let items = contents[currentFolderId] || [];
            const search = document.getElementById('detailSearchInputMateri').value.toLowerCase().trim();
            if (search) items = items.filter(item => item.name.toLowerCase().includes(search) || (item.content && item
                .content.toLowerCase().includes(search)));
            document.getElementById('contentCountMateri').textContent = `${items.length} item`;
            const list = document.getElementById('contentListMateri');
            if (items.length === 0) {
                list.innerHTML =
                    `<div class="empty-content"><i class="fas fa-${search ? 'search' : 'inbox'}"></i><p>${search ? 'Tidak ada hasil untuk "' + search + '"' : 'Belum ada konten. Tambah catatan atau upload file.'}</p></div>`;

            let html = '';
            items.forEach(item => {
                const icon = item.type === 'file' ? 'fa-file' : 'fa-sticky-note';
                const ext = item.type === 'file' ? getFileExtensionMateri(item.name) : '';
                const badge = ext ? `<span class="file-badge">${ext}</span>` : '';
                let displayName = item.name;
                if (search) {
                    const regex = new RegExp(`(${search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    displayName = displayName.replace(regex, '<span class="highlight">$1</span>');
                }
                let previewText = '';
                if (item.type === 'note' && item.content) {
                    const cleanContent = item.content.replace(/\*\*/g, '').replace(/\_/g, '').replace(/__/g, '').replace(
                        /```/g, '').replace(/---/g, '');
                    previewText = cleanContent.length > 60 ? cleanContent.substring(0, 60) + '...' : cleanContent;
                }
                html += `
                    <div class="content-item" onclick="openContentMateri('${item.id}')">
                        <div class="left">

            });
            list.innerHTML = html;

        function openFolderModalMateri(editId = null) {
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('modalTitle').innerText = editId ? 'Edit Folder' : 'Tambah Folder';
            document.getElementById('modalInput').value = editId ? folders.find(f => f.id === editId)?.name || '' : '';
            document.getElementById('modalTextarea').value = '';
            document.getElementById('modalType').value = editId ? 'editFolder' : 'folder';
            document.getElementById('modalTargetId').value = editId || '';
            document.getElementById('modalConfirmBtn').innerText = editId ? 'Update' : 'Buat';
            document.getElementById('modalInput').focus();
            document.querySelector('.editor-toolbar').style.display = 'none';
            document.getElementById('modalTextarea').style.borderRadius = '20px';
            document.getElementById('modalTextarea').style.borderTop = '1px solid #c6ddee';

        function confirmModal() {
            const type = document.getElementById('modalType').value;
            const name = document.getElementById('modalInput').value.trim();
            const desc = document.getElementById('modalTextarea').value.trim();
            const targetId = document.getElementById('modalTargetId').value;
            if (!name) { alert('Nama tidak boleh kosong'); return; }
            if (type === 'folder') {
                const newFolder = { id: 'f' + Date.now(), name: name, tags: [], favorite: false };
                folders.push(newFolder);
                contents[newFolder.id] = [];
            } else if (type === 'editFolder') {
                const f = folders.find(f => f.id === targetId);
                if (f) f.name = name;
            } else if (type === 'note') {
                if (!contents[targetId]) contents[targetId] = [];
                contents[targetId].push({ id: 'n' + Date.now(), name: name || 'Catatan baru', type: 'note', dataUrl: '#',
                    content: desc || '' });
                renderDetailMateri();
                closeModal();
                saveMateriData();
                return;
            } else if (type === 'editNote') {
                const item = findContentMateri(targetId);
                if (item) { item.name = name || item.name;
                    item.content = desc !== undefined ? desc : item.content; }
                renderDetailMateri();
                closeModal();
                saveMateriData();
                return;
            }
            closeModal();
            renderHomeMateri();
            saveMateriData();
        }

        function editFolderMateri(id) { openFolderModalMateri(id); }

        function deleteFolderMateri(id) {
            if (!confirm(`Hapus folder "${folders.find(f => f.id === id)?.name}"?`)) return;
            // Hapus semua file yang ada di folder dari IndexedDB
            const items = contents[id] || [];
            for (const item of items) {
                if (item.type === 'file') {
                    deleteFileFromMateriDB(item.id).catch(console.warn);
                }
            }
            folders = folders.filter(f => f.id !== id);
            delete contents[id];
            if (currentFolderId === id) goHomeMateri();
            renderHomeMateri();
            saveMateriData();
        }

        function toggleFavoriteMateri(id) {
            const f = folders.find(f => f.id === id);
            if (f) f.favorite = !f.favorite;
            renderHomeMateri();
            saveMateriData();
        }

        function openTagModalMateri() {
            const tag = prompt('Tambahkan tag untuk folder ini:');
            if (tag && tag.trim()) {
                const f = folders.find(f => f.id === currentFolderId);
                if (f) { if (!f.tags) f.tags = [];
                    f.tags.push(tag.trim());
                    renderDetailMateri();
                    renderHomeMateri();
                    saveMateriData(); }
            }
        }

        function findContentMateri(id) {
            for (const key in contents) {
                const found = contents[key].find(c => c.id === id);
                if (found) return found;
            }
            return null;
        }

        function getFileExtensionMateri(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const map = { 'pdf': 'PDF', 'doc': 'DOC', 'docx': 'DOCX', 'xls': 'XLS', 'xlsx': 'XLSX', 'ppt': 'PPT',
                'pptx': 'PPTX', 'jpg': 'JPG', 'jpeg': 'JPEG', 'png': 'PNG', 'gif': 'GIF', 'svg': 'SVG', 'mp4': 'MP4',
                'mp3': 'MP3', 'avi': 'AVI', 'zip': 'ZIP', 'rar': 'RAR', 'txt': 'TXT', 'html': 'HTML', 'css': 'CSS',
                'js': 'JS', 'json': 'JSON', 'xml': 'XML', 'csv': 'CSV' };
            return map[ext] || ext.toUpperCase();
        }

        function renderNoteContentMateri(content) {
            let html = content
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
                .replace(/(https?:\/\/[^\s<]+)(?![^<]*<\/a>)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\_(.+?)\_/g, '<em>$1</em>')
                .replace(/\_\_(.+?)\_\_/g, '<u>$1</u>')
                .replace(/## (.+)/g, '<h3>$1</h3>')
                .replace(/> (.+)/g, '<blockquote>$1</blockquote>')
                .replace(/\- (.+)/g, '<li>$1</li>')
                .replace(/```([\s\S]+?)```/g, '<pre><code>$1</code></pre>')
                .replace(/\<center\>(.+?)\<\/center\>/g, '<div style="text-align:center;">$1</div>')
                .replace(/\-\-\-\n/g, '<hr>')
                .replace(/\n/g, '<br>');
            return html;
        }

        // ---- openContentMateri dengan IndexedDB ----
        function openContentMateri(itemId) {
            const item = findContentMateri(itemId);
            if (!item) return;
            const previewOverlay = document.getElementById('previewOverlay');
            const previewContent = document.getElementById('previewContent');
            previewOverlay.style.display = 'flex';

            if (item.type === 'file') {
                getFileFromMateriDB(item.id).then(dataUrl => {
                    let html = '';
                    if (dataUrl) {
                        if (dataUrl.startsWith('data:image/')) html =
                            `<div class="file-preview"><img src="${dataUrl}" alt="${item.name}" /></div>`;
                        else if (dataUrl.startsWith('data:video/')) html =
                            `<div class="file-preview"><video controls src="${dataUrl}"></video></div>`;
                        else if (dataUrl.startsWith('data:audio/')) html =
                            `<div class="file-preview"><audio controls src="${dataUrl}"></audio></div>`;
                        else if (dataUrl.startsWith('data:application/pdf')) html =
                            `<div class="file-preview"><iframe src="${dataUrl}"></iframe></div>`;
                        else if (dataUrl.startsWith('data:text/') || dataUrl.includes('charset')) {
                            try {
                                const text = atob(dataUrl.split(',')[1]);
                                html =
                                    `<div class="file-preview"><div style="background:#f6faff;padding:1rem;border-radius:16px;text-align:left;white-space:pre-wrap;max-height:70vh;overflow:auto;font-size:0.9rem;">${text}</div></div>`;
                            } catch {
                                html =
                                    `<div class="file-preview"><div class="file-info"><i class="fas fa-file"></i> File: ${item.name}<br><br><a href="${dataUrl}" download class="btn btn-success btn-sm">Download</a></div></div>`;
                            }
                        } else html =
                            `<div class="file-preview"><div class="file-info"><i class="fas fa-file"></i> File: ${item.name}<br><br><a href="${dataUrl}" download class="btn btn-success btn-sm">Download</a></div></div>`;
                    } else {
                        html =
                            `<div class="file-preview"><div class="file-info"><i class="fas fa-file"></i> File: ${item.name}<br><br><span style="color:#6b93b3;">File tidak ditemukan di database</span></div></div>`;
                    }
                    previewContent.innerHTML = html;
                }).catch(err => {
                    previewContent.innerHTML =
                        `<div class="file-preview"><div class="file-info"><i class="fas fa-exclamation-triangle"></i> Gagal memuat file: ${err.message}</div></div>`;
                });
            } else {
                // catatan
                const content = item.content || '(Catatan kosong)';
                previewContent.innerHTML =
                    `<div class="note-preview-content"><h2>📝 ${item.name}</h2><div class="content">${renderNoteContentMateri(content)}</div></div>`;
            }
        }

        function editContentMateri(itemId) {

            if (item.type === 'note') {
                document.getElementById('modalOverlay').style.display = 'flex';

                document.getElementById('modalType').value = 'editNote';

                document.getElementById('modalInput').focus();

                openContentMateri(itemId);
            }

        function deleteContentMateri(itemId) {
            if (!confirm('Hapus konten ini?')) return;
            const item = findContentMateri(itemId);
            if (item && item.type === 'file') {
                deleteFileFromMateriDB(item.id).then(() => {
                    for (const key in contents) {
                        contents[key] = contents[key].filter(c => c.id !== itemId);
                    }
                    renderDetailMateri();
                    saveMateriData();
                }).catch(err => alert('Gagal menghapus file: ' + err.message));
            } else {
                for (const key in contents) {
                    contents[key] = contents[key].filter(c => c.id !== itemId);
                }
                renderDetailMateri();
                saveMateriData();
            }
        }

        // ---- handleFileUploadMateri dengan IndexedDB ----
        function handleFileUploadMateri(event) {
            const files = event.target.files;
            if (!files.length || !currentFolderId) {
                if (!currentFolderId) alert('Pilih folder terlebih dahulu');
                return;
            }
            if (!contents[currentFolderId]) contents[currentFolderId] = [];

            let loaded = 0;
            const total = files.length;

            for (const file of files) {
                const reader = new FileReader();
                const id = 'f' + Date.now() + Math.random().toString(36).substr(2, 6);
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    saveFileToMateriDB(id, dataUrl).then(() => {
                        contents[currentFolderId].push({
                            id: id,
                            name: file.name,
                            type: 'file',
                            dataUrl: '', // tidak disimpan di localStorage
                            content: ''
                        });
                        loaded++;
                        if (loaded === total) {
                            renderDetailMateri();
                            saveMateriData();
                            alert('✅ ' + total + ' file berhasil diupload! (File disimpan di IndexedDB, kapasitas lebih besar)');
                        }
                    }).catch(err => {
                        alert('❌ Gagal menyimpan file ke IndexedDB: ' + err.message);
                    });
                };
                reader.onerror = function() {
                    alert('❌ Gagal membaca file: ' + file.name);
                };
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }

        function insertFormat(openTag, closeTag) {
            const textarea = document.getElementById('modalTextarea');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            const before = textarea.value.substring(0, start);
            const after = textarea.value.substring(end);
            if (selectedText) {
                textarea.value = before + openTag + selectedText + closeTag + after;
                textarea.focus();
                textarea.selectionStart = start + openTag.length;
                textarea.selectionEnd = end + openTag.length;
            } else {
                textarea.value = before + openTag + closeTag + after;
                textarea.focus();
                textarea.selectionStart = start + openTag.length;
                textarea.selectionEnd = start + openTag.length;
            }
        }

        function insertLink() {
            const url = prompt('Masukkan URL link:', 'https://');
            if (url && url.trim()) {
                const textarea = document.getElementById('modalTextarea');
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const selectedText = textarea.value.substring(start, end) || 'Link';
                const before = textarea.value.substring(0, start);
                const after = textarea.value.substring(end);
                textarea.value = before + '[' + selectedText + '](' + url.trim() + ')' + after;
                textarea.focus();
                textarea.selectionStart = start + 1;
                textarea.selectionEnd = start + 1 + selectedText.length;
            }
        }

        // ===== SAVE/LOAD PEDOMAN (sama seperti Materi) =====
        function savePedomanData() {
            localStorage.setItem('pedoman_folders', JSON.stringify(pedomanFolders));
            localStorage.setItem('pedoman_contents', JSON.stringify(pedomanContents));
        }

        function loadPedomanData() {
            const f = localStorage.getItem('pedoman_folders');
            const c = localStorage.getItem('pedoman_contents');
            if (f && c) {
                try {
                    pedomanFolders = JSON.parse(f);
                    pedomanContents = JSON.parse(c);
                    return true;
                } catch (_) { return false; }
            }
            return false;
        }

        // ===== MIGRASI DATA LAMA (dari pedoman_hidup_data) =====
        function migratePedomanOldData() {
            const oldRaw = localStorage.getItem('pedoman_hidup_data');
            if (!oldRaw) return false;
            try {
                const oldData = JSON.parse(oldRaw);
                if (!oldData.folders || typeof oldData.folders !== 'object') return false;

                const oldFolders = oldData.folders;
                const newFolders = [];
                const newContents = {};

                for (const id in oldFolders) {
                    const f = oldFolders[id];
                    if (!f || typeof f !== 'object') continue;
                    const newId = 'pf' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
                    newFolders.push({
                        id: newId,
                        name: f.name || 'Folder',
                        tags: f.tags || [],
                        favorite: f.favorite || false,
                        gradient: f._gradient || getPedomanGradient(),
                        icon: f._icon || getPedomanIcon()
                    });
                    newContents[newId] = [];

                    // Surah items
                    if (f.surah && Array.isArray(f.surah.items)) {
                        for (const item of f.surah.items) {
                            newContents[newId].push({
                                id: 'pc' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                                type: 'surah',
                                name: item.name || 'Surah',
                                dataUrl: item.image || '',
                                content: item.caption || ''
                            });
                        }
                    }
                    // Asbab
                    if (f.asbab && typeof f.asbab.content === 'string') {
                        newContents[newId].push({
                            id: 'pc' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                            type: 'asbab',
                            name: 'Asbabun Nuzul',
                            dataUrl: '',
                            content: f.asbab.content
                        });
                    }
                    // Makna
                    if (f.makna && typeof f.makna.content === 'string') {
                        newContents[newId].push({
                            id: 'pc' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
                            type: 'makna',
                            name: 'Makna Surah',
                            dataUrl: '',
                            content: f.makna.content
                        });
                    }
                }

                if (newFolders.length > 0) {
                    pedomanFolders = newFolders;
                    pedomanContents = newContents;
                    savePedomanData();
                    localStorage.removeItem('pedoman_hidup_data');
                    return true;
                }
                return false;
            } catch (_) { return false; }
        }

                    if (!pedomanContents[f.id]) pedomanContents[f.id] = [];
                }

                return;
            }

            if (migratePedomanOldData()) {
                for (const f of pedomanFolders) {
                    if (!f.gradient) f.gradient = getPedomanGradient();
                    if (!f.icon) f.icon = getPedomanIcon();

                'linear-gradient(135deg, #f6d365 0%, #fda085 100%)',
                'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
                'linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%)',

            return palettes[Math.floor(Math.random() * palettes.length)];

            ];
            return icons[Math.floor(Math.random() * icons.length)];

        // ============================================
        // BACKUP & RESTORE SEMUA DATA (diperbarui untuk IndexedDB)
        // ============================================
        async function backupData() {
            // Kumpulkan metadata dari localStorage
            const data = {
                materi_folders: localStorage.getItem('materi_folders'),
                materi_contents: localStorage.getItem('materi_contents'),
                eng_alphabet: localStorage.getItem('eng_alphabet'),
                eng_daily: localStorage.getItem('eng_daily'),
                eng_vocab: localStorage.getItem('eng_vocab'),
                pedoman_folders: localStorage.getItem('pedoman_folders'),
                pedoman_contents: localStorage.getItem('pedoman_contents'),
                timestamp: new Date().toISOString()
            };

            // Backup file dari IndexedDB
            try {
                const db = await openMateriDB();
                const tx = db.transaction('files', 'readonly');
                const store = tx.objectStore('files');
                const allFiles = await new Promise((resolve, reject) => {
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
                data.materi_files = allFiles;
            } catch (e) {
                console.warn('Gagal mengambil file dari IndexedDB untuk backup:', e);
                data.materi_files = [];
            }

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `portal_belajar_backup_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            URL.revokeObjectURL(link.href);
            alert('✅ Data berhasil di-backup (termasuk file besar dari IndexedDB)!');
        }

        async function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    let count = 0;
                    if (data.materi_folders) { localStorage.setItem('materi_folders', data.materi_folders); count++; }
                    if (data.materi_contents) { localStorage.setItem('materi_contents', data.materi_contents); count++; }
                    if (data.eng_alphabet) { localStorage.setItem('eng_alphabet', data.eng_alphabet); count++; }
                    if (data.eng_daily) { localStorage.setItem('eng_daily', data.eng_daily); count++; }
                    if (data.eng_vocab) { localStorage.setItem('eng_vocab', data.eng_vocab); count++; }
                    if (data.pedoman_folders) { localStorage.setItem('pedoman_folders', data.pedoman_folders); count++; }
                    if (data.pedoman_contents) { localStorage.setItem('pedoman_contents', data.pedoman_contents); count++; }

                    // Restore file ke IndexedDB
                    if (data.materi_files && Array.isArray(data.materi_files)) {
                        const db = await openMateriDB();
                        const tx = db.transaction('files', 'readwrite');
                        const store = tx.objectStore('files');
                        for (const fileData of data.materi_files) {
                            store.put(fileData);
                        }
                        await new Promise((resolve, reject) => {
                            tx.oncomplete = resolve;
                            tx.onerror = reject;
                        });
                        count += data.materi_files.length;
                    }

                    alert(`✅ Restore berhasil! ${count} data dimuat. Halaman akan refresh.`);
                    location.reload();
                } catch(err) {
                    alert('❌ File tidak valid atau gagal dipulihkan: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // KEYBOARD SHORTCUTS & AUTO-RESTORE

                }, 300);
            }
        });

    </script>
