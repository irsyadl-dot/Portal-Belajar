<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Belajar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== GLOBAL RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #eef6fe, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.4s;
        }
        body.english-mode {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(255, 200, 150, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(200, 180, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(255, 220, 180, 0.1) 0%, transparent 40%);
        }
        body.english-mode.light-mode {
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(255, 200, 150, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(200, 180, 255, 0.15) 0%, transparent 50%);
        }
        body.pedoman-mode {
            background: transparent;
        }
        body.pedoman-mode::before {
            display: none;
        }

        .main-wrapper {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .main-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 40, 80, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.7);
            text-align: center;
            transition: all 0.4s;
        }
        body.english-mode .main-container {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.08);
        }
        body.english-mode.light-mode .main-container {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.05);
        }
        body.pedoman-mode .main-container {
            background: transparent !important;
            backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            border-radius: 0 !important;
        }

        .main-title {
            font-weight: 700;
            font-size: 2.8rem;
            background: linear-gradient(135deg, #0b3a5e, #1b5e8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        body.english-mode .main-title {
            background: linear-gradient(135deg, #e74c3c, #f39c12, #2ecc71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.pedoman-mode .main-title {
            background: linear-gradient(135deg, #c4b5fd, #8B5CF6, #6C3CE1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(108, 60, 225, 0.2);
        }
        .main-subtitle {
            color: #6b93b3;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }
        body.english-mode .main-subtitle {
            color: #5a4a3a;
        }
        body.pedoman-mode .main-subtitle {
            color: rgba(196, 181, 253, 0.4);
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }
        .menu-card {
            background: white;
            border-radius: 28px;
            padding: 2rem 1.5rem;
            border: 1px solid rgba(200, 222, 245, 0.5);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        body.english-mode .menu-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }
        body.english-mode.light-mode .menu-card {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
        }
        body.pedoman-mode .menu-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(108, 60, 225, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        body.pedoman-mode .menu-card:hover {
            border-color: rgba(108, 60, 225, 0.3);
            box-shadow: 0 18px 35px -14px rgba(108, 60, 225, 0.1);
        }
        .menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 18px 35px -14px #1a5f8b30;
        }
        .menu-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 0.8rem;
        }
        .menu-icon.materi {
            color: #2b7bb0;
            background: rgba(43, 123, 176, 0.1);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 0.8rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-icon.materi i {
            font-size: 2.5rem;
        }
        body.english-mode .menu-icon.materi {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }
        body.pedoman-mode .menu-icon.materi {
            background: rgba(108, 60, 225, 0.08);
            color: #8B5CF6;
        }
        .menu-icon.english {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 0.8rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-icon.english i {
            font-size: 2.5rem;
        }
        body.english-mode .menu-icon.english {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
        }
        body.pedoman-mode .menu-icon.english {
            background: rgba(108, 60, 225, 0.08);
            color: #8B5CF6;
        }
        .menu-icon.pedoman {
            color: #8B5CF6;
            background: rgba(108, 60, 225, 0.12);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 0.8rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-icon.pedoman i {
            font-size: 2.8rem;
        }
        body.pedoman-mode .menu-icon.pedoman {
            background: rgba(108, 60, 225, 0.15);
            color: #c4b5fd;
            box-shadow: 0 0 30px rgba(108, 60, 225, 0.1);
        }
        .menu-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: #0b2b4a;
            margin-bottom: 0.3rem;
        }
        body.english-mode .menu-name {
            color: #2c3e50;
        }
        body.english-mode.light-mode .menu-name {
            color: #2c3e50;
        }
        body.pedoman-mode .menu-name {
            color: #c4b5fd;
        }
        .menu-desc {
            color: #6b93b3;
            font-size: 0.85rem;
        }
        body.english-mode .menu-desc {
            color: #5a4a3a;
        }
        body.english-mode.light-mode .menu-desc {
            color: #5a4a3a;
        }
        body.pedoman-mode .menu-desc {
            color: rgba(196, 181, 253, 0.4);
        }
        #appContainer {
            display: none;
            width: 100%;
            margin: 0 auto;
        }
        #appContainer.show {
            display: block;
        }

        .btn-back-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(26, 95, 139, 0.1);
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #1a5f8b;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        body.english-mode .btn-back-home {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }
        body.english-mode.light-mode .btn-back-home {
            background: rgba(231, 76, 60, 0.06);
            color: #c0392b;
        }
        body.pedoman-mode .btn-back-home {
            background: rgba(108, 60, 225, 0.2);
            color: #c4b5fd;
            backdrop-filter: blur(4px);
        }
        body.pedoman-mode .btn-back-home:hover {
            background: rgba(108, 60, 225, 0.4);
        }
        .btn-back-home:hover {
            background: rgba(26, 95, 139, 0.2);
        }
        body.english-mode .btn-back-home:hover {
            background: rgba(231, 76, 60, 0.2);
        }

        /* Tombol Backup & Restore di menu utama */
        .backup-restore-bar {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin-top: 2.5rem;
            padding-top: 1.8rem;
            border-top: 1px solid rgba(26, 95, 139, 0.08);
        }
        .backup-restore-bar button {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Inter', sans-serif;
        }
        .backup-restore-bar .btn-backup {
            background: #1a5f8b;
            color: white;
            box-shadow: 0 8px 16px -6px #1a5f8b60;
        }
        .backup-restore-bar .btn-backup:hover {
            background: #0f4a70;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -8px #1a5f8b80;
        }
        .backup-restore-bar .btn-restore {
            background: #b87333;
            color: white;
            box-shadow: 0 8px 16px -6px #b8733360;
        }
        .backup-restore-bar .btn-restore:hover {
            background: #9a6229;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -8px #b8733380;
        }
        .backup-restore-bar input[type="file"] {
            display: none;
        }

        @media (max-width:768px) {
            .main-container {
                padding: 1.8rem 1.5rem;
            }
            .main-title {
                font-size: 2rem;
            }
            .menu-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .backup-restore-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .backup-restore-bar button {
                justify-content: center;
            }
        }

        /* ===== MATERI APP STYLES (tetap sama) ===== */
        .materi-app-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 40, 80, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.7);
            min-height: 70vh;
            text-align: left;
        }
        body.english-mode .materi-app-wrapper {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.08);
        }
        body.english-mode.light-mode .materi-app-wrapper {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.05);
        }
        body.pedoman-mode .materi-app-wrapper {
            background: rgba(10, 10, 30, 0.7);
            border: 1px solid rgba(108, 60, 225, 0.1);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4), 0 0 60px rgba(108, 60, 225, 0.02);
            border-radius: 48px;
        }
        .materi-app-wrapper .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .materi-app-wrapper .header h1 {
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0b3a5e, #1b5e8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        body.english-mode .materi-app-wrapper .header h1 {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.pedoman-mode .materi-app-wrapper .header h1 {
            background: linear-gradient(135deg, #c4b5fd, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .materi-app-wrapper .header h1 i {
            background: #1a5f8b;
            padding: 0.5rem;
            border-radius: 30px;
            color: white;
            font-size: 1.4rem;
            -webkit-text-fill-color: white;
            box-shadow: 0 8px 14px -6px rgba(10, 55, 94, 0.3);
        }
        body.english-mode .materi-app-wrapper .header h1 i {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
        }
        body.pedoman-mode .materi-app-wrapper .header h1 i {
            background: linear-gradient(135deg, #8B5CF6, #6C3CE1);
            -webkit-text-fill-color: #fff;
        }
        .materi-app-wrapper .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .materi-app-wrapper .btn-back {
            background: rgba(26, 95, 139, 0.1);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #1a5f8b;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 0.4rem;
            transition: 0.2s;
        }
        body.english-mode .materi-app-wrapper .btn-back {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }
        body.pedoman-mode .materi-app-wrapper .btn-back {
            background: rgba(108, 60, 225, 0.1);
            color: #8B5CF6;
        }
        .materi-app-wrapper .btn-back:hover {
            background: rgba(26, 95, 139, 0.2);
        }
        .materi-app-wrapper .btn-back.show {
            display: flex;
        }
        .materi-app-wrapper .search-box {
            background: white;
            padding: 0.4rem 1.2rem 0.4rem 1.8rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: 0 6px 16px rgba(27, 80, 128, 0.06);
            border: 1px solid rgba(60, 130, 200, 0.12);
        }
        body.english-mode .materi-app-wrapper .search-box {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
        }
        body.english-mode.light-mode .materi-app-wrapper .search-box {
            background: white;
            border-color: rgba(255, 255, 255, 0.3);
        }
        body.pedoman-mode .materi-app-wrapper .search-box {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(108, 60, 225, 0.1);
        }
        .materi-app-wrapper .search-box i {
            color: #2b7bb0;
        }
        body.english-mode .materi-app-wrapper .search-box i {
            color: #e74c3c;
        }
        body.pedoman-mode .materi-app-wrapper .search-box i {
            color: #8B5CF6;
        }
        .materi-app-wrapper .search-box input {
            border: none;
            padding: 0.6rem 0;
            width: 180px;
            font-size: 0.9rem;
            background: transparent;
            outline: none;
            color: #0b2b4a;
        }
        body.english-mode .materi-app-wrapper .search-box input {
            color: #2c3e50;
        }
        body.english-mode.light-mode .materi-app-wrapper .search-box input {
            color: #0b2b4a;
        }
        body.pedoman-mode .materi-app-wrapper .search-box input {
            color: #c4b5fd;
        }
        .materi-app-wrapper .search-box input::placeholder {
            color: #9bb7d4;
        }
        body.english-mode .materi-app-wrapper .search-box input::placeholder {
            color: #999;
        }
        body.pedoman-mode .materi-app-wrapper .search-box input::placeholder {
            color: rgba(196, 181, 253, 0.3);
        }
        .materi-app-wrapper .btn {
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .materi-app-wrapper .btn-primary {
            background: #1a5f8b;
            color: white;
            box-shadow: 0 8px 14px -6px #1a5f8b60;
        }
        body.english-mode .materi-app-wrapper .btn-primary {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            box-shadow: 0 8px 32px rgba(231, 76, 60, 0.2);
        }
        body.pedoman-mode .materi-app-wrapper .btn-primary {
            background: linear-gradient(135deg, #8B5CF6, #6C3CE1);
            color: #fff;
            box-shadow: 0 8px 32px rgba(108, 60, 225, 0.2);
        }
        .materi-app-wrapper .btn-primary:hover {
            background: #0f4a70;
            transform: translateY(-2px);
        }
        .materi-app-wrapper .btn-outline {
            background: transparent;
            border: 1px solid #b3d3ed;
            color: #0e3d5e;
        }
        body.english-mode .materi-app-wrapper .btn-outline {
            border-color: rgba(255, 255, 255, 0.3);
            color: #2c3e50;
        }
        body.english-mode.light-mode .materi-app-wrapper .btn-outline {
            border-color: rgba(255, 255, 255, 0.3);
            color: #0e3d5e;
        }
        body.pedoman-mode .materi-app-wrapper .btn-outline {
            border-color: rgba(108, 60, 225, 0.15);
            color: #8B5CF6;
        }
        .materi-app-wrapper .btn-outline:hover {
            background: rgba(26, 95, 139, 0.06);
        }
        .materi-app-wrapper .btn-sm {
            padding: 0.35rem 1rem;
            font-size: 0.78rem;
        }
        .materi-app-wrapper .btn-danger {
            background: #b54a4a;
            color: white;
        }
        .materi-app-wrapper .btn-danger:hover {
            background: #9e3a3a;
        }
        .materi-app-wrapper .btn-success {
            background: #2a7a5e;
            color: white;
        }
        .materi-app-wrapper .btn-success:hover {
            background: #1e5f48;
        }
        .materi-app-wrapper .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 0.5rem;
        }
        .materi-app-wrapper .folder-card {
            background: white;
            border-radius: 28px;
            padding: 1.5rem 1.2rem;
            box-shadow: 0 8px 20px -8px rgba(10, 55, 94, 0.06);
            border: 1px solid rgba(200, 222, 245, 0.5);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.25s;
            text-align: center;
        }
        body.english-mode .materi-app-wrapper .folder-card {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
        }
        body.english-mode.light-mode .materi-app-wrapper .folder-card {
            background: white;
            border-color: rgba(255, 255, 255, 0.3);
        }
        body.pedoman-mode .materi-app-wrapper .folder-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(108, 60, 225, 0.08);
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.2);
        }
        .materi-app-wrapper .folder-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 35px -14px #1a5f8b30;
        }
        body.pedoman-mode .materi-app-wrapper .folder-card:hover {
            border-color: rgba(108, 60, 225, 0.2);
            box-shadow: 0 18px 35px -14px rgba(108, 60, 225, 0.1);
        }
        .materi-app-wrapper .folder-card .icon {
            font-size: 2.8rem;
            color: #2b7bb0;
            margin-bottom: 0.3rem;
        }
        body.english-mode .materi-app-wrapper .folder-card .icon {
            color: #e74c3c;
        }
        body.pedoman-mode .materi-app-wrapper .folder-card .icon {
            color: #8B5CF6;
        }
        .materi-app-wrapper .folder-card .name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #0b2b4a;
        }
        body.english-mode .materi-app-wrapper .folder-card .name {
            color: #2c3e50;
        }
        body.english-mode.light-mode .materi-app-wrapper .folder-card .name {
            color: #0b2b4a;
        }
        body.pedoman-mode .materi-app-wrapper .folder-card .name {
            color: #c4b5fd;
        }
        .materi-app-wrapper .folder-card .tag-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }

        .pedoman-app .toast {

        .pedoman-app .modal-overlay {

        /* ===== PEDOMAN BACK BUTTON (di dalam pedoman-app) ===== */
        .pedoman-back-home {

            border-radius: 40px;

<body>

    <div class="main-wrapper">
        <!-- MAIN MENU -->
        <div id="mainMenu" class="main-container">
            <div class="main-title"><i class="fas fa-graduation-cap"></i> Portal Belajar</div>
            <div class="main-subtitle">Pilih aplikasi yang ingin kamu gunakan</div>
            <div class="menu-grid">
                <div class="menu-card" onclick="openApp('materi')">
                    <span class="menu-icon materi"><i class="fas fa-book-open"></i></span>
                    <div class="menu-name">📚 Materi Kuliah</div>
                    <div class="menu-desc">Kelola folder, catatan, dan file kuliah</div>
                </div>
                <div class="menu-card" onclick="openApp('english')">
                    <span class="menu-icon english"><i class="fas fa-language"></i></span>
                    <div class="menu-name">🌐 English Learning</div>
                    <div class="menu-desc">Belajar alphabet, percakapan, dan kosakata</div>
                </div>
                <div class="menu-card" onclick="openApp('pedoman')">
                    <span class="menu-icon pedoman"><i class="fas fa-quran"></i></span>
                    <div class="menu-name">📖 Pedoman Hidup</div>
                    <div class="menu-desc">Surah, Asbabun Nuzul, dan Makna Surah</div>
                </div>
            </div>
            <!-- TOMBOL BACKUP & RESTORE -->
            <div class="backup-restore-bar">
                <button class="btn-backup" onclick="backupData()"><i class="fas fa-download"></i> Backup Semua Data</button>
                <button class="btn-restore" onclick="document.getElementById('restoreInput').click()"><i class="fas fa-upload"></i> Restore Data</button>
                <input type="file" id="restoreInput" accept=".json" onchange="restoreData(event)" />
            </div>
        </div>

        <!-- APP CONTAINER -->
        <div id="appContainer" class="main-container">
            <button class="btn-back-home" onclick="goHome()">
                <i class="fas fa-arrow-left"></i> Kembali ke Menu Utama
            </button>
            <div id="appContent"></div>
        </div>
    </div>

    <!-- ===== MODAL UNTUK MATERI APP (global) ===== -->
    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
        <div class="modal-box">
            <h3 id="modalTitle">Tambah Catatan</h3>
            <input type="text" id="modalInput" placeholder="Judul catatan" />
            <div class="editor-toolbar">
                <button onclick="insertFormat('**', '**')" title="Tebal"><b>B</b></button>
                <button onclick="insertFormat('_', '_')" title="Miring"><i>I</i></button>
                <button onclick="insertFormat('__', '__')" title="Garis Bawah"><u>U</u></button>
                <span class="separator"></span>
                <button onclick="insertFormat('## ', '')" title="Heading">H</button>
                <button onclick="insertFormat('> ', '')" title="Quote">&ldquo;</button>
                <button onclick="insertFormat('- ', '')" title="List">•</button>
                <span class="separator"></span>
                <button onclick="insertLink()" title="Link"><i class="fas fa-link"></i></button>
                <button onclick="insertFormat('```\n', '\n```')" title="Code"><i class="fas fa-code"></i></button>
                <span class="separator"></span>
                <button onclick="insertFormat('---\n', '')" title="Garis">—</button>
                <button onclick="insertFormat('<center>', '</center>')" title="Tengah">⏺</button>
            </div>
            <textarea id="modalTextarea" placeholder="Tulis catatan di sini..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeModal()">Batal</button>
                <button class="btn btn-primary" id="modalConfirmBtn" onclick="confirmModal()">Simpan</button>
            </div>
            <input type="hidden" id="modalType" value="note" />
            <input type="hidden" id="modalTargetId" value="" />
        </div>
    </div>

    <!-- ===== PREVIEW MODAL UNTUK MATERI APP ===== -->
    <div class="preview-overlay" id="previewOverlay" onclick="if(event.target===this) closePreview()">
        <div class="preview-box">
            <button class="close-preview" onclick="closePreview()"><i class="fas fa-times"></i></button>
            <div id="previewContent"></div>
        </div>
    </div>

    <!-- ===== MODAL UNTUK ENGLISH APP ===== -->
    <div class="eng-modal-overlay" id="engModalOverlay" onclick="if(event.target===this) closeEngModal()">
        <div class="eng-modal">
            <h3 id="engModalTitle">Edit Item</h3>
            <div id="engModalBody"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEngModal()">Batal</button>
                <button class="btn-save" onclick="saveEngModal()">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // NAVIGASI UTAMA
        // ============================================
        function openApp(app) {
            localStorage.setItem('lastApp', app);
            document.getElementById('mainMenu').style.display = 'none';
            const container = document.getElementById('appContainer');
            container.classList.add('show');
            container.style.display = 'block';

            document.body.className = '';
            if (app === 'english') {
                document.body.classList.add('english-mode');
                if (localStorage.getItem('theme') === 'light') {
                    document.body.classList.add('light-mode');
                }
            } else if (app === 'pedoman') {
                document.body.classList.add('pedoman-mode');
            }

            const content = document.getElementById('appContent');
            if (app === 'materi') loadMateri(content);
            else if (app === 'english') loadEnglish(content);
            else if (app === 'pedoman') loadPedoman(content);
        }

        function goHome() {
            localStorage.removeItem('lastApp');
            document.getElementById('mainMenu').style.display = 'block';
            const container = document.getElementById('appContainer');
            container.classList.remove('show');
            container.style.display = 'none';
            document.body.className = '';
            document.getElementById('appContent').innerHTML = '';
            closeModal();
            closePreview();
            closeEngModal();
        }

        // ============================================
        // MATERI APP — DENGAN LOCALSTORAGE
        // ============================================
        let folders = [];
        let contents = {};
        let currentFolderId = null;

        function saveMateriData() {
            localStorage.setItem('materi_folders', JSON.stringify(folders));
            localStorage.setItem('materi_contents', JSON.stringify(contents));
        }

        function loadMateriData() {
            const f = localStorage.getItem('materi_folders');
            const c = localStorage.getItem('materi_contents');
            if (f && c) {
                folders = JSON.parse(f);
                contents = JSON.parse(c);
                return true;
            }
            return false;
        }

        function initMateriData() {
            if (!loadMateriData()) {
                folders = [
                    { id: 'f1', name: 'Algoritma & Struktur Data', tags: ['UTS', '2026'], favorite: false },
                    { id: 'f2', name: 'Pemrograman Web', tags: ['React', 'VS Code'], favorite: false },
                    { id: 'f3', name: 'Basis Data', tags: ['SQL'], favorite: false }
                ];
                contents = { 'f1': [], 'f2': [], 'f3': [] };
                saveMateriData();
            }
        }

        function loadMateri(el) {
            initMateriData();
            el.innerHTML = `
                <div class="materi-app-wrapper" id="materiApp">
                    <div class="header">
                        <div class="header-left">
                            <button class="btn-back" id="btnBackMateri" onclick="goHomeMateri()">
                                <i class="fas fa-arrow-left"></i> Kembali
                            </button>
                            <h1 onclick="goHomeMateri()">
                                <i class="fas fa-graduation-cap"></i> MATERI KULIAH
                            </h1>
                        </div>
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchInputMateri" placeholder="Cari folder..." oninput="renderHomeMateri()" />
                        </div>
                    </div>
                    <div id="homeViewMateri">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom:1.5rem;">
                            <span style="font-weight:600; color:#1a5f8b;"><i class="fas fa-folder"></i> Semua Folder</span>
                            <button class="btn btn-primary" onclick="openFolderModalMateri()">
                                <i class="fas fa-plus-circle"></i> Tambah Folder
                            </button>
                        </div>
                        <div class="folder-grid" id="folderGridMateri"></div>
                    </div>
                    <div id="detailViewMateri" style="display:none;">
                        <div class="detail-header">
                            <div class="title" id="detailTitleMateri"><i class="fas fa-folder-open"></i> Nama Folder</div>
                            <div>

        function renderHomeMateri() {
            const grid = document.getElementById('folderGridMateri');
            if (!grid) return;
            const search = document.getElementById('searchInputMateri').value.toLowerCase().trim();
            let filtered = folders.filter(f =>
                f.name.toLowerCase().includes(search) ||
                (f.tags && f.tags.some(t => t.toLowerCase().includes(search)))
            );
            if (filtered.length === 0) {
                grid.innerHTML =
                    `<div style="grid-column:1/-1; text-align:center; padding:3rem 0; color:#5d89af;"><i class="fas fa-folder-open" style="font-size:2.5rem; display:block; margin-bottom:0.5rem;"></i>Tidak ada folder</div>`;
                return;
            }
            let html = '';
            filtered.forEach(f => {
                const tagHtml = (f.tags || []).map(t => `<span class="tag">#${t}</span>`).join('');
                const count = (contents[f.id] || []).length;
                html += `
                    <div class="folder-card" onclick="openDetailMateri('${f.id}')">
                        <div class="icon"><i class="fas fa-folder"></i></div>
                        <div class="name">${f.name}</div>
                        <div class="tag-group">${tagHtml}</div>
                        <div class="meta">${count} item ${f.favorite ? '⭐' : ''}</div>
                        <div class="actions">
                            <button onclick="event.stopPropagation();toggleFavoriteMateri('${f.id}')"><i class="${f.favorite ? 'fas' : 'far'} fa-star"></i></button>
                            <button onclick="event.stopPropagation();editFolderMateri('${f.id}')"><i class="fas fa-edit"></i></button>
                            <button onclick="event.stopPropagation();deleteFolderMateri('${f.id}')"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
            saveMateriData();
        }

        function renderDetailMateri() {
            const folder = folders.find(f => f.id === currentFolderId);
            if (!folder) { goHomeMateri(); return; }
            document.getElementById('detailTitleMateri').innerHTML = `<i class="fas fa-folder-open"></i> ${folder.name}`;
            document.getElementById('detailTagsMateri').innerHTML = (folder.tags || []).map(t =>
                `<span class="tag">#${t}</span>`).join('');
            let items = contents[currentFolderId] || [];
            const search = document.getElementById('detailSearchInputMateri').value.toLowerCase().trim();
            if (search) items = items.filter(item => item.name.toLowerCase().includes(search) || (item.content && item
                .content.toLowerCase().includes(search)));
            document.getElementById('contentCountMateri').textContent = `${items.length} item`;
            const list = document.getElementById('contentListMateri');
            if (items.length === 0) {
                list.innerHTML =
                    `<div class="empty-content"><i class="fas fa-${search ? 'search' : 'inbox'}"></i><p>${search ? 'Tidak ada hasil untuk "' + search + '"' : 'Belum ada konten. Tambah catatan atau upload file.'}</p></div>`;
                return;
            }
            let html = '';
            items.forEach(item => {
                const icon = item.type === 'file' ? 'fa-file' : 'fa-sticky-note';
                const ext = item.type === 'file' ? getFileExtensionMateri(item.name) : '';
                const badge = ext ? `<span class="file-badge">${ext}</span>` : '';
                let displayName = item.name;
                if (search) {
                    const regex = new RegExp(`(${search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    displayName = displayName.replace(regex, '<span class="highlight">$1</span>');
                }
                let previewText = '';
                if (item.type === 'note' && item.content) {
                    const cleanContent = item.content.replace(/\*\*/g, '').replace(/\_/g, '').replace(/__/g, '').replace(
                        /```/g, '').replace(/---/g, '');
                    previewText = cleanContent.length > 60 ? cleanContent.substring(0, 60) + '...' : cleanContent;
                }
                html += `
                    <div class="content-item" onclick="openContentMateri('${item.id}')">
                        <div class="left">
                            <i class="fas ${icon}"></i>
                            <span class="name">${displayName} ${badge}</span>
                            ${previewText ? `<span class="preview">${previewText}</span>` : ''}
                        </div>
                        <div class="right">
                            <button onclick="event.stopPropagation();editContentMateri('${item.id}')"><i class="fas fa-edit"></i></button>
                            <button class="delete" onclick="event.stopPropagation();deleteContentMateri('${item.id}')"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
            saveMateriData();
        }

        function openDetailMateri(folderId) {
            currentFolderId = folderId;
            document.getElementById('homeViewMateri').style.display = 'none';
            document.getElementById('detailViewMateri').style.display = 'block';
            document.getElementById('btnBackMateri').classList.add('show');
            document.getElementById('detailSearchInputMateri').value = '';
            renderDetailMateri();

        function goHomeMateri() {
            currentFolderId = null;
            document.getElementById('homeViewMateri').style.display = 'block';
            document.getElementById('detailViewMateri').style.display = 'none';
            document.getElementById('btnBackMateri').classList.remove('show');
            renderHomeMateri();

        function openFolderModalMateri(editId = null) {
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('modalTitle').innerText = editId ? 'Edit Folder' : 'Tambah Folder';
            document.getElementById('modalInput').value = editId ? folders.find(f => f.id === editId)?.name || '' : '';
            document.getElementById('modalTextarea').value = '';
            document.getElementById('modalType').value = editId ? 'editFolder' : 'folder';
            document.getElementById('modalTargetId').value = editId || '';
            document.getElementById('modalConfirmBtn').innerText = editId ? 'Update' : 'Buat';
            document.getElementById('modalInput').focus();
            document.querySelector('.editor-toolbar').style.display = 'none';
            document.getElementById('modalTextarea').style.borderRadius = '20px';
            document.getElementById('modalTextarea').style.borderTop = '1px solid #c6ddee';
        }

        function confirmModal() {
            const type = document.getElementById('modalType').value;
            const name = document.getElementById('modalInput').value.trim();
            const desc = document.getElementById('modalTextarea').value.trim();
            const targetId = document.getElementById('modalTargetId').value;
            if (!name) { alert('Nama tidak boleh kosong'); return; }
            if (type === 'folder') {
                const newFolder = { id: 'f' + Date.now(), name: name, tags: [], favorite: false };
                folders.push(newFolder);
                contents[newFolder.id] = [];
            } else if (type === 'editFolder') {
                const f = folders.find(f => f.id === targetId);
                if (f) f.name = name;
            } else if (type === 'note') {
                if (!contents[targetId]) contents[targetId] = [];
                contents[targetId].push({ id: 'n' + Date.now(), name: name || 'Catatan baru', type: 'note', dataUrl: '#',
                    content: desc || '' });
                renderDetailMateri();
                closeModal();
                saveMateriData();
                return;
            } else if (type === 'editNote') {
                const item = findContentMateri(targetId);
                if (item) { item.name = name || item.name;
                    item.content = desc !== undefined ? desc : item.content; }
                renderDetailMateri();
                closeModal();
                saveMateriData();
                return;
            }
            closeModal();
            renderHomeMateri();
            saveMateriData();
        }

        function editFolderMateri(id) { openFolderModalMateri(id); }

        function deleteFolderMateri(id) {
            if (!confirm(`Hapus folder "${folders.find(f => f.id === id)?.name}"?`)) return;
            folders = folders.filter(f => f.id !== id);
            delete contents[id];
            if (currentFolderId === id) goHomeMateri();
            renderHomeMateri();
            saveMateriData();
        }

        function toggleFavoriteMateri(id) {
            const f = folders.find(f => f.id === id);
            if (f) f.favorite = !f.favorite;
            renderHomeMateri();
            saveMateriData();
        }

        function openTagModalMateri() {
            const tag = prompt('Tambahkan tag untuk folder ini:');
            if (tag && tag.trim()) {
                const f = folders.find(f => f.id === currentFolderId);
                if (f) { if (!f.tags) f.tags = [];
                    f.tags.push(tag.trim());
                    renderDetailMateri();
                    renderHomeMateri();
                    saveMateriData(); }
            }
        }

        function findContentMateri(id) {
            for (const key in contents) {
                const found = contents[key].find(c => c.id === id);
                if (found) return found;
            }
            return null;
        }

        function getFileExtensionMateri(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const map = { 'pdf': 'PDF', 'doc': 'DOC', 'docx': 'DOCX', 'xls': 'XLS', 'xlsx': 'XLSX', 'ppt': 'PPT',
                'pptx': 'PPTX', 'jpg': 'JPG', 'jpeg': 'JPEG', 'png': 'PNG', 'gif': 'GIF', 'svg': 'SVG', 'mp4': 'MP4',
                'mp3': 'MP3', 'avi': 'AVI', 'zip': 'ZIP', 'rar': 'RAR', 'txt': 'TXT', 'html': 'HTML', 'css': 'CSS',
                'js': 'JS', 'json': 'JSON', 'xml': 'XML', 'csv': 'CSV' };
            return map[ext] || ext.toUpperCase();
        }

        function renderNoteContentMateri(content) {
            let html = content
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
                .replace(/(https?:\/\/[^\s<]+)(?![^<]*<\/a>)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\_(.+?)\_/g, '<em>$1</em>')
                .replace(/\_\_(.+?)\_\_/g, '<u>$1</u>')
                .replace(/## (.+)/g, '<h3>$1</h3>')
                .replace(/> (.+)/g, '<blockquote>$1</blockquote>')
                .replace(/\- (.+)/g, '<li>$1</li>')
                .replace(/```([\s\S]+?)```/g, '<pre><code>$1</code></pre>')
                .replace(/\<center\>(.+?)\<\/center\>/g, '<div style="text-align:center;">$1</div>')
                .replace(/\-\-\-\n/g, '<hr>')
                .replace(/\n/g, '<br>');
            return html;
        }

        function openContentMateri(itemId) {
            const item = findContentMateri(itemId);
            if (!item) return;
            const previewOverlay = document.getElementById('previewOverlay');
            const previewContent = document.getElementById('previewContent');
            previewOverlay.style.display = 'flex';
            if (item.type === 'file') {
                let html = '';
                if (item.dataUrl && item.dataUrl !== '#') {
                    const url = item.dataUrl;
                    if (url.startsWith('data:image/')) html =
                        `<div class="file-preview"><img src="${url}" alt="${item.name}" /></div>`;
                    else if (url.startsWith('data:video/')) html =
                        `<div class="file-preview"><video controls src="${url}"></video></div>`;
                    else if (url.startsWith('data:audio/')) html =
                        `<div class="file-preview"><audio controls src="${url}"></audio></div>`;
                    else if (url.startsWith('data:application/pdf')) html =
                        `<div class="file-preview"><iframe src="${url}"></iframe></div>`;
                    else if (url.startsWith('data:text/') || url.includes('charset')) {
                        try {
                            const text = atob(url.split(',')[1]);
                            html =
                                `<div class="file-preview"><div style="background:#f6faff;padding:1rem;border-radius:16px;text-align:left;white-space:pre-wrap;max-height:70vh;overflow:auto;font-size:0.9rem;">${text}</div></div>`;
                        } catch {
                            html =
                                `<div class="file-preview"><div class="file-info"><i class="fas fa-file"></i> File: ${item.name}<br><br><a href="${url}" download class="btn btn-success btn-sm">Download</a></div></div>`;
                        }
                    } else html =
                        `<div class="file-preview"><div class="file-info"><i class="fas fa-file"></i> File: ${item.name}<br><br><a href="${url}" download class="btn btn-success btn-sm">Download</a></div></div>`;
                } else html =
                    `<div class="file-preview"><div class="file-info"><i class="fas fa-file"></i> File: ${item.name}<br><br><span style="color:#6b93b3;">File belum memiliki data</span></div></div>`;
                previewContent.innerHTML = html;
            } else {
                const content = item.content || '(Catatan kosong)';
                previewContent.innerHTML =
                    `<div class="note-preview-content"><h2>📝 ${item.name}</h2><div class="content">${renderNoteContentMateri(content)}</div></div>`;
            }
        }

        function closePreview() { document.getElementById('previewOverlay').style.display = 'none'; }

        function editContentMateri(itemId) {
            const item = findContentMateri(itemId);

            if (item.type === 'note') {
                document.getElementById('modalOverlay').style.display = 'flex';
                document.getElementById('modalTitle').innerText = 'Edit Catatan';
                document.getElementById('modalInput').value = item.name;
                document.getElementById('modalTextarea').value = item.content || '';

                document.getElementById('modalConfirmBtn').innerText = 'Update';
                document.querySelector('.editor-toolbar').style.display = 'flex';
                document.getElementById('modalTextarea').style.borderRadius = '0 0 20px 20px';
                document.getElementById('modalTextarea').style.borderTop = 'none';
                document.getElementById('modalInput').focus();
            } else openContentMateri(itemId);
        }

        function deleteContentMateri(itemId) {
            if (!confirm('Hapus konten ini?')) return;
            for (const key in contents) contents[key] = contents[key].filter(c => c.id !== itemId);
            renderDetailMateri();
            saveMateriData();
        }

        function handleFileUploadMateri(event) {
            const files = event.target.files;
            if (!files.length || !currentFolderId) { if (!currentFolderId) alert('Pilih folder terlebih dahulu'); return; }
            if (!contents[currentFolderId]) contents[currentFolderId] = [];
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    contents[currentFolderId].push({ id: 'f' + Date.now() + Math.random().toString(36).substr(2, 6),
                        name: file.name, type: 'file', dataUrl: e.target.result, content: '' });
                    renderDetailMateri();
                    saveMateriData();
                };
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }

        function insertFormat(openTag, closeTag) {
            const textarea = document.getElementById('modalTextarea');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            const before = textarea.value.substring(0, start);
            const after = textarea.value.substring(end);
            if (selectedText) {
                textarea.value = before + openTag + selectedText + closeTag + after;
                textarea.focus();
                textarea.selectionStart = start + openTag.length;
                textarea.selectionEnd = end + openTag.length;
            } else {
                textarea.value = before + openTag + closeTag + after;
                textarea.focus();
                textarea.selectionStart = start + openTag.length;
                textarea.selectionEnd = start + openTag.length;
            }
        }

        function insertLink() {
            const url = prompt('Masukkan URL link:', 'https://');
            if (url && url.trim()) {
                const textarea = document.getElementById('modalTextarea');
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const selectedText = textarea.value.substring(start, end) || 'Link';
                const before = textarea.value.substring(0, start);
                const after = textarea.value.substring(end);
                textarea.value = before + '[' + selectedText + '](' + url.trim() + ')' + after;
                textarea.focus();
                textarea.selectionStart = start + 1;
                textarea.selectionEnd = start + 1 + selectedText.length;
            }
        }

        function switchEngTab(tab) {
            engCurrentTab = tab;
            document.querySelectorAll('.eng-wrap .tab-eng-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.eng-wrap .tab-eng-btn[data-tab="${tab}"]`)?.classList.add('active');
            document.querySelectorAll('.eng-wrap .panel-eng').forEach(p => p.classList.remove('active'));
            const target = document.getElementById('eng' + tab.charAt(0).toUpperCase() + tab.slice(1));
            if (target) target.classList.add('active');
            if (tab !== 'dashboard') {
                document.getElementById('engFavSection').style.display = 'none';
                engShowFav = false;
            }
        }

        function engPlayAudio(text) {
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            speechSynthesis.speak(utterance);
        }

        function engToggleFavorite(type, index) {
            if (type === 'alphabet') {
                engAlphabetData[index].fav = !engAlphabetData[index].fav;
                engRenderAlphabet();
            } else if (type === 'daily') {
                engDailyData[index].fav = !engDailyData[index].fav;
                engRenderDaily();
            } else if (type === 'vocab') {
                engVocabData[index].fav = !engVocabData[index].fav;
                engRenderVocab();
            }
            engUpdateDashboard();
            if (engShowFav) engRenderFavorites();
            engSaveData();
        }

        function toggleEngFav() {
            engShowFav = !engShowFav;
            const section = document.getElementById('engFavSection');
            if (engShowFav) {
                section.style.display = 'block';
                engRenderFavorites();
            } else {
                section.style.display = 'none';
            }
        }

        function engRenderFavorites() {
            const container = document.getElementById('engFavList');
            const countSpan = document.getElementById('engFavCount');

            const favorites = [];
            engAlphabetData.forEach((item, idx) => { if (item.fav) favorites.push({ type: 'Alphabet',
                    label: `Huruf ${item.huruf}`, detail: `Pengucapan: ${item.pronounce}`, index: idx,
                    source: 'alphabet' }); });
            engDailyData.forEach((item, idx) => { if (item.fav) favorites.push({ type: 'Daily', label: item.english,
                    detail: `Arti: ${item.arti}`, index: idx, source: 'daily' }); });
            engVocabData.forEach((item, idx) => { if (item.fav) favorites.push({ type: 'Vocabulary', label: item.en,
                    detail: `Arti: ${item.id}`, index: idx, source: 'vocab' }); });

            countSpan.textContent = `${favorites.length} item`;

            if (favorites.length === 0) {
                container.innerHTML =
                    `<div class="no-result-eng"><i class="fas fa-heart"></i> Belum ada favorit. Klik ❤️ di item yang kamu suka!</div>`;
                return;
            }

            container.innerHTML = favorites.map((fav, idx) => `
                    <div class="fav-item-eng">
                        <span class="type">${fav.type}</span>
                        <span class="content"><span class="highlight">${fav.label}</span> ${fav.detail ? `— ${fav.detail}` : ''}</span>
                        <button class="remove" onclick="engRemoveFavorite('${fav.source}', ${fav.index})"><i class="fas fa-times"></i> Hapus</button>
                    </div>
                `).join('');
        }

        function engRemoveFavorite(source, index) {
            if (source === 'alphabet') { engAlphabetData[index].fav = false;
                engRenderAlphabet(); } else if (source === 'daily') { engDailyData[index].fav = false;
                engRenderDaily(); } else if (source === 'vocab') { engVocabData[index].fav = false;
                engRenderVocab(); }
            engUpdateDashboard();
            engRenderFavorites();
            engSaveData();
        }

        function engSearchAlphabet() {
            const query = document.getElementById('engSearchAlphabet').value.toLowerCase().trim();
            const items = document.querySelectorAll('#engAlphabetGrid .card-eng');
            let found = 0;
            items.forEach((card, index) => {
                const data = engAlphabetData[index];
                if (!data) return;
                const searchText = (data.huruf + ' ' + data.pronounce + ' ' + data.note).toLowerCase();
                const match = searchText.includes(query);
                card.classList.toggle('hidden', !match && query !== '');
                if (match || query === '') found++;
            });
            document.getElementById('engAlphabetResult').textContent = query === '' ? 'Menampilkan semua' :
                `Menampilkan ${found} hasil`;
        }

        function engSearchDaily() {
            const query = document.getElementById('engSearchDaily').value.toLowerCase().trim();
            const items = document.querySelectorAll('#engDailyGrid .daily-card-eng');
            let found = 0;
            items.forEach((card, index) => {
                const data = engDailyData[index];
                if (!data) return;
                const searchText = (data.english + ' ' + data.arti + ' ' + data.note + ' ' + data.cara).toLowerCase();
                const match = searchText.includes(query);
                card.classList.toggle('hidden', !match && query !== '');
                if (match || query === '') found++;
            });
            document.getElementById('engDailyResult').textContent = query === '' ? 'Menampilkan semua' :
                `Menampilkan ${found} hasil`;
        }

        function engSearchVocab() {
            const query = document.getElementById('engSearchVocab').value.toLowerCase().trim();
            const items = document.querySelectorAll('#engVocabList .vocab-item-eng');
            let found = 0;
            items.forEach((item, index) => {
                const data = engVocabData[index];
                if (!data) return;
                const searchText = (data.en + ' ' + data.id + ' ' + data.pronounce).toLowerCase();
                const match = searchText.includes(query);
                item.classList.toggle('hidden', !match && query !== '');
                if (match || query === '') found++;
            });
            document.getElementById('engVocabResult').textContent = query === '' ? 'Menampilkan semua' :
                `Menampilkan ${found} hasil`;
        }

        function engClearSearch(type) {
            if (type === 'alphabet') { document.getElementById('engSearchAlphabet').value = '';
                engSearchAlphabet(); } else if (type === 'daily') { document.getElementById('engSearchDaily').value = '';
                engSearchDaily(); } else if (type === 'vocab') { document.getElementById('engSearchVocab').value = '';
                engSearchVocab(); }
        }

        function engUpdateDashboard() {
            document.getElementById('engStatAlphabet').textContent = engAlphabetData.length;
            document.getElementById('engStatDaily').textContent = engDailyData.length;
            document.getElementById('engStatVocab').textContent = engVocabData.length;
            const totalFav = [...engAlphabetData, ...engDailyData, ...engVocabData].filter(item => item.fav).length;
            document.getElementById('engStatFav').textContent = totalFav;
        }

        function engRenderAlphabet() {
            const grid = document.getElementById('engAlphabetGrid');
            grid.innerHTML = '';
            engAlphabetData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'card-eng';
                card.innerHTML = `
                        <div class="card-header">
                            <span class="letter">${item.huruf}</span>
                            <div class="actions">
                                <button class="fav-btn ${item.fav ? 'active' : ''}" onclick="engToggleFavorite('alphabet', ${idx})"><i class="fas fa-heart"></i></button>
                                <button onclick="engEditAlphabet(${idx})"><i class="fas fa-pen"></i></button>
                                <button class="delete" onclick="engHapusAlphabet(${idx})"><i class="fas fa-trash-alt"></i></button>
                                <button onclick="engPlayAudio('${item.huruf}')"><i class="fas fa-volume-up"></i></button>
                            </div>
                        </div>
                        <span class="pronounce-badge" onclick="engPlayAudio('${item.pronounce}')">${item.pronounce}</span>
                        <div class="card-content">
                            ${item.link ? `<br><a href="${item.link}" target="_blank" class="link-item"><i class="fas fa-link"></i> Buka link</a>` : ''}
                            ${item.image ? `<br><img src="${item.image}" alt="gambar ${item.huruf}" style="max-height:80px;object-fit:cover;" />` : ''}
                            ${item.note ? `<div class="note-box">📌 ${item.note}</div>` : ''}
                        </div>
                        <div class="card-footer">
                            <input type="file" accept="image/*" style="background:transparent;border:none;color:#5a4a3a;font-size:0.6rem;flex:1;padding:2px 0;" onchange="engUploadImage(${idx}, this)" />
                            <button class="btn-soft-eng" onclick="engEditCatatanAlphabet(${idx})"><i class="fas fa-sticky-note"></i> ${item.note ? 'Edit Catatan' : 'Tambah Catatan'}</button>
                        </div>
                    `;
                grid.appendChild(card);
            });
            engSearchAlphabet();
            engUpdateDashboard();
            engSaveData();
        }

        function engTambahAlphabet() {
            const huruf = document.getElementById('engNewLetter').value.trim().toUpperCase();
            const pronounce = document.getElementById('engNewPronounce').value.trim();
            const link = document.getElementById('engNewLink').value.trim();
            const fileInput = document.getElementById('engNewImage');
            if (!huruf) { alert('Masukkan huruf!'); return; }
            if (engAlphabetData.some(item => item.huruf === huruf)) { alert('Huruf sudah ada!'); return; }

            let image = '';
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    image = e.target.result;
                    engAlphabetData.push({ huruf, pronounce, link, image, note: '', fav: false });
                    engRenderAlphabet();
                    document.getElementById('engNewLetter').value = '';
                    document.getElementById('engNewPronounce').value = '';
                    document.getElementById('engNewLink').value = '';
                    document.getElementById('engNewImage').value = '';
                    engSaveData();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                engAlphabetData.push({ huruf, pronounce, link, image, note: '', fav: false });
                engRenderAlphabet();
                document.getElementById('engNewLetter').value = '';
                document.getElementById('engNewPronounce').value = '';
                document.getElementById('engNewLink').value = '';
                document.getElementById('engNewImage').value = '';
                engSaveData();
            }
        }

        function engHapusAlphabet(idx) {
            if (confirm(`Hapus huruf "${engAlphabetData[idx].huruf}"?`)) {
                engAlphabetData.splice(idx, 1);
                engRenderAlphabet();
                engSaveData();
            }
        }

        function engEditAlphabet(idx) {
            const item = engAlphabetData[idx];
            engOpenModal('Edit Huruf', [
                { key: 'huruf', label: 'Huruf', value: item.huruf },
                { key: 'pronounce', label: 'Pengucapan', value: item.pronounce, placeholder: 'contoh: eɪ' },
                { key: 'link', label: 'Link', value: item.link, placeholder: 'https://...' }
            ], function(data) {
                if (data.huruf.trim()) {
                    engAlphabetData[idx].huruf = data.huruf.trim().toUpperCase();
                    engAlphabetData[idx].pronounce = data.pronounce.trim();
                    engAlphabetData[idx].link = data.link.trim();
                    engRenderAlphabet();
                    engSaveData();
                } else alert('Huruf tidak boleh kosong!');
            });
        }

        function engEditCatatanAlphabet(idx) {
            const item = engAlphabetData[idx];
            engOpenModal('Catatan untuk ' + item.huruf, [
                { key: 'note', label: 'Catatan', type: 'textarea', value: item.note || '',
                    placeholder: 'Tulis catatan di sini...' }
            ], function(data) {
                engAlphabetData[idx].note = data.note.trim();
                engRenderAlphabet();
                engSaveData();
            });
        }

        function engUploadImage(idx, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    engAlphabetData[idx].image = e.target.result;
                    engRenderAlphabet();
                    engSaveData();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function engRenderDaily() {
            const grid = document.getElementById('engDailyGrid');
            grid.innerHTML = '';
            engDailyData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'daily-card-eng';
                card.innerHTML = `
                        <div class="daily-header">
                            <span class="daily-number">💬 #${idx+1}</span>
                            <div class="daily-actions">
                                <button class="fav-btn ${item.fav ? 'active' : ''}" onclick="engToggleFavorite('daily', ${idx})"><i class="fas fa-heart"></i></button>
                                <button onclick="engEditDaily(${idx})"><i class="fas fa-pen"></i></button>
                                <button class="delete" onclick="engHapusDaily(${idx})"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                        <div class="daily-english">${item.english}</div>
                        <span class="daily-cara" onclick="engPlayAudio('${item.english}')">${item.cara}</span>
                        <div class="daily-arti">📖 ${item.arti}</div>
                        ${item.link ? `<div class="daily-link"><a href="${item.link}" target="_blank"><i class="fas fa-link"></i> Buka referensi</a></div>` : ''}
                        ${item.note ? `<div class="daily-note"><span class="note-label"><i class="fas fa-pen"></i> Catatan:</span> ${item.note}</div>` : ''}
                        <div class="daily-footer">
                            <button class="btn-soft-eng" onclick="engEditCatatanDaily(${idx})"><i class="fas fa-sticky-note"></i> ${item.note ? 'Edit Catatan' : 'Tambah Catatan'}</button>
                            <button class="btn-soft-eng" onclick="engPlayAudio('${item.english}')"><i class="fas fa-volume-up"></i> Dengar</button>
                        </div>
                    `;
                grid.appendChild(card);
            });
            engSearchDaily();
            engUpdateDashboard();
            engSaveData();
        }

        function engTambahDaily() {
            const english = document.getElementById('engDailyEnglish').value.trim();
            const cara = document.getElementById('engDailyCara').value.trim();
            const arti = document.getElementById('engDailyArt').value.trim();
            const link = document.getElementById('engDailyLink').value.trim();
            if (!english || !arti) { alert('⚠️ Tulisan Inggris dan Arti wajib diisi!'); return; }
            engDailyData.push({ english, cara, arti, link, note: '', fav: false });
            engRenderDaily();
            document.getElementById('engDailyEnglish').value = '';
            document.getElementById('engDailyCara').value = '';
            document.getElementById('engDailyArt').value = '';
            document.getElementById('engDailyLink').value = '';
            engSaveData();
        }

        function engHapusDaily(idx) {
            if (confirm('Hapus percakapan ini?')) {
                engDailyData.splice(idx, 1);
                engRenderDaily();
                engSaveData();
            }
        }

        function engEditDaily(idx) {
            const item = engDailyData[idx];
            engOpenModal('Edit Percakapan', [
                { key: 'english', label: 'Tulisan Inggris', value: item.english },
                { key: 'cara', label: 'Cara Baca (Indo)', value: item.cara },
                { key: 'arti', label: 'Arti (Indo)', value: item.arti },
                { key: 'link', label: 'Link', value: item.link, placeholder: 'https://...' }
            ], function(data) {
                if (data.english.trim() && data.arti.trim()) {
                    engDailyData[idx].english = data.english.trim();
                    engDailyData[idx].cara = data.cara.trim();
                    engDailyData[idx].arti = data.arti.trim();
                    engDailyData[idx].link = data.link.trim();
                    engRenderDaily();
                    engSaveData();
                } else alert('Tulisan Inggris dan Arti wajib diisi!');
            });
        }

        function engEditCatatanDaily(idx) {
            const item = engDailyData[idx];
            engOpenModal('Catatan untuk Percakapan #' + (idx + 1), [
                { key: 'note', label: 'Catatan', type: 'textarea', value: item.note || '',
                    placeholder: 'Tulis catatan di sini...' }
            ], function(data) {
                engDailyData[idx].note = data.note.trim();
                engRenderDaily();
                engSaveData();
            });
        }

        function engRenderVocab() {
            const container = document.getElementById('engVocabList');
            container.innerHTML = '';
            engVocabData.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'vocab-item-eng';
                div.innerHTML = `
                        <span class="en" onclick="engPlayAudio('${item.en}')">${item.en} <i class="fas fa-volume-up"></i></span>
                        <span class="id">${item.id}</span>

                            <button class="fav-btn ${item.fav ? 'active' : ''}" onclick="engToggleFavorite('vocab', ${idx})"><i class="fas fa-heart"></i></button>
                            <button onclick="engEditVocab(${idx})"><i class="fas fa-pen"></i></button>
                            <button class="delete" onclick="engHapusVocab(${idx})"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    `;
                container.appendChild(div);
            });
            engSearchVocab();
            engUpdateDashboard();
            engSaveData();

        function engTambahVocab() {
            const en = document.getElementById('engVocabEn').value.trim();
            const id = document.getElementById('engVocabId').value.trim();
            const pronounce = document.getElementById('engVocabPronounce').value.trim();
            if (!en || !id) { alert('Kata Inggris dan Arti wajib diisi!'); return; }
            engVocabData.push({ en, id, pronounce: pronounce || '-', fav: false });
            engRenderVocab();
            document.getElementById('engVocabEn').value = '';
            document.getElementById('engVocabId').value = '';
            document.getElementById('engVocabPronounce').value = '';
            engSaveData();
        }

        function engHapusVocab(idx) {
            if (confirm(`Hapus kosakata "${engVocabData[idx].en}"?`)) {
                engVocabData.splice(idx, 1);
                engRenderVocab();
                engSaveData();
            }
        }

        function engEditVocab(idx) {
            const item = engVocabData[idx];
            engOpenModal('Edit Kosakata', [
                { key: 'en', label: 'Kata Inggris', value: item.en },
                { key: 'id', label: 'Arti Indonesia', value: item.id },
                { key: 'pronounce', label: 'Pengucapan', value: item.pronounce, placeholder: '/ˈhæpi/' }
            ], function(data) {
                if (data.en.trim() && data.id.trim()) {
                    engVocabData[idx].en = data.en.trim();
                    engVocabData[idx].id = data.id.trim();
                    engVocabData[idx].pronounce = data.pronounce.trim() || '-';
                    engRenderVocab();
                    engSaveData();
                } else alert('Kata Inggris dan Arti wajib diisi!');

                                ? `<textarea id="engModal_${f.key}" placeholder="${f.placeholder || ''}">${f.value || ''}</textarea>`
                                : `<input type="${f.type || 'text'}" id="engModal_${f.key}" placeholder="${f.placeholder || ''}" value="${f.value || ''}" />`
                            }
                        </div>
                    `;
            });
            document.getElementById('engModalBody').innerHTML = html;
            engModalCallback = callback;
            overlay.classList.add('show');

            }
            closeEngModal();

            localStorage.setItem('pedoman_folders', JSON.stringify(pedomanFolders));

        }

        function loadPedomanData() {
            const f = localStorage.getItem('pedoman_folders');
            const c = localStorage.getItem('pedoman_contents');
            if (f && c) {
                pedomanFolders = JSON.parse(f);
                pedomanContents = JSON.parse(c);
                return true;
            }
            return false;
        }

            if (!loadPedomanData() || pedomanFolders.length === 0) {
                const id = generatePedomanId();
                pedomanFolders = [{
                    id,

                    gradient: 'linear-gradient(135deg, #6C3CE1, #8B5CF6)',
                    icon: 'fa-quran'
                }];
                pedomanContents = {};
                pedomanContents[id] = [
                    { id: generatePedomanId(), type: 'surah', image: null,
                        caption: 'بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ\nالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ\nالرَّحْمَـٰنِ الرَّحِيمِ\nمَالِكِ يَوْمِ الدِّينِ\nإِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ\nاهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ\nصِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ' },
                    { id: generatePedomanId(), type: 'asbab',
                        content: 'Surat Al-Fatihah diturunkan di Mekkah. Menurut sebagian ulama, surat ini diturunkan setelah surat Al-Muddassir. Surat ini disebut juga Ummul Quran (Induk Al-Quran) karena menjadi pembuka dan inti dari seluruh isi Al-Quran.' },
                    { id: generatePedomanId(), type: 'makna',
                        content: 'Surat Al-Fatihah mengandung 7 ayat yang merupakan rangkuman dari seluruh ajaran Islam. Kandungan utamanya adalah pujian kepada Allah, pengakuan bahwa hanya Allah yang berhak disembah, permohonan petunjuk ke jalan yang lurus, serta doa agar terhindar dari kesesatan.' }
                ];
                savePedomanData();
            }
            // Pastikan setiap folder punya content array
            for (const folder of pedomanFolders) {
                if (!pedomanContents[folder.id] || !Array.isArray(pedomanContents[folder.id])) {
                    pedomanContents[folder.id] = [];
                }
                // Pastikan ada minimal satu item untuk tiap tipe jika kosong
                const types = pedomanContents[folder.id].map(i => i.type);
                if (!types.includes('surah')) pedomanContents[folder.id].push({ id: generatePedomanId(),
                    type: 'surah', image: null, caption: '' });
                if (!types.includes('asbab')) pedomanContents[folder.id].push({ id: generatePedomanId(),
                    type: 'asbab', content: '' });
                if (!types.includes('makna')) pedomanContents[folder.id].push({ id: generatePedomanId(),
                    type: 'makna', content: '' });
            }
            savePedomanData();
        }
